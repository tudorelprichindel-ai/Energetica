<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Reset esențial pentru a preveni tăierea footer-ului */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { height: 100%; width: 100%; }
        
        body { 
            display: flex; flex-direction: column;
            background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
        }

        /* HEADER ȘI FOOTER UNIFORMIZATE */
        header, footer {
            width: 100%;
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
        }

        header { position: fixed; top: 0; height: 80px; border-bottom: 1px solid var(--glass); }
        
        footer { 
            margin-top: auto; 
            height: 80px; 
            border-top: 1px solid var(--wine); 
            flex-direction: column;
        }

        .shimmer-element {
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 4px; font-weight: 700; }

        /* NAV SIDEBAR */
        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .nav-link:hover { transform: translateX(10px); color: var(--white); }

        /* MAIN PENTRU CENTRARE */
        main { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 120px 5% 40px; 
            width: 100%;
        }

        .contact-grid { 
            display: grid; 
            grid-template-columns: 1fr 1.2fr; 
            gap: 60px; 
            max-width: 1200px; 
            width: 100%;
            align-items: center;
        }

        .contact-info h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 4rem); color: var(--gold); font-style: italic; margin-bottom: 20px; }

        .contact-form-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            padding: 40px; 
            border: 1px solid var(--glass); 
            box-shadow: 20px 20px 50px rgba(0,0,0,0.5);
            width: 100%;
        }

        .form-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass); padding: 15px; color: var(--white); margin-bottom: 20px; font-family: 'Montserrat'; outline: none; }
        .submit-btn { width: 100%; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 18px; text-transform: uppercase; letter-spacing: 5px; cursor: pointer; transition: 0.3s; font-weight: 700; }
        .submit-btn:hover { background: var(--gold); color: #000; }

        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { text-decoration: none; font-size: 1.3rem; }
        .copyright { font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        /* OPTIMIZARE MOBIL - REZOLVARE PROBLEME SEMNALATE */
        @media (max-width: 850px) {
            /* 1. Grosime identica header & footer */
            header, footer { height: 70px !important; }
            
            /* 2. Asigurare footer full width fara intreruperi */
            footer { width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; padding: 15px 0; }

            .sidebar {
                position: relative; top: 0; left: 0; transform: none;
                flex-direction: row; flex-wrap: wrap; justify-content: center;
                margin: 80px 0 20px 0; padding: 15px; gap: 1rem;
                background: rgba(0, 0, 0, 0.4); width: 100%;
                border-bottom: 1px solid var(--glass);
            }
            
            main { padding: 20px 5%; align-items: flex-start; }

            /* 3. Centrare perfecta formular */
            .contact-grid { 
                grid-template-columns: 1fr; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
                text-align: center;
            }
            
            .contact-info { width: 100%; margin-bottom: 30px; }
            .contact-info h1 { font-size: 2.2rem; }
            
            .contact-form-card { 
                width: 100%; 
                max-width: 450px; /* Centrare optica pe mijloc */
                margin: 0 auto; 
                padding: 30px 20px;
            }
            
            .nav-link { font-size: 0.6rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main>
        <div class="contact-grid">
            <div class="contact-info">
                <h1 class="shimmer-element">Contact</h1>
                <p style="margin-bottom: 20px; font-weight: 300; opacity: 0.8;">Transformă intenția în dialog.</p>
                <div style="font-size: 0.9rem; margin-bottom: 10px;">
                    <a href="https://wa.me/407XXXXXXXX" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 4px;">WhatsApp</a>
                </div>
                <div style="font-size: 0.9rem;">
                    <a href="https://t.me/elena_shipko" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 4px;">Telegram: @elena_shipko</a>
                </div>
            </div>

            <div class="contact-form-card">
                <form>
                    <input type="text" class="form-control" placeholder="Nume">
                    <input type="email" class="form-control" placeholder="Email">
                    <textarea class="form-control" placeholder="Mesaj" style="height: 120px; resize: none;"></textarea>
                    <button type="submit" class="submit-btn">Trimite mesajul</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
