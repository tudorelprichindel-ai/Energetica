<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --burgundy: #5e1914;
            --white: #ffffff;
            --hermes-terracotta: #d35400;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Reset esențial pentru simetrie */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        
        html, body { height: 100%; width: 100%; }
        
        body { 
            display: flex; flex-direction: column;
            background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        /* CURSOR DIAMANT */
        .cursor-dot {
            width: 25px; height: 25px;
            background-image: url('diamond-graphic-clipart-design-free-png.webp');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            position: fixed; pointer-events: none; z-index: 9999; 
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
        .cursor-dot.glow { width: 38px; height: 38px; filter: brightness(1.2); }

        .cursor-trail {
            position: fixed; pointer-events: none; z-index: 9998;
            width: 15px; height: 15px; border-radius: 50%; opacity: 0;
            transform: translate(-50%, -50%); filter: blur(4px); 
            transition: opacity 1s ease-out; animation: smokeRise 4s infinite ease-out;
        }
        .trail-gold { background: var(--gold); }
        .trail-burgundy { background: var(--burgundy); }
        .trail-terracotta { background: var(--hermes-terracotta); }

        @keyframes smokeRise {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -120%) scale(2); opacity: 0; }
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('cristale3.jpg') no-repeat center center;
            background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out;
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* HEADER ȘI FOOTER UNIFORMIZATE */
        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--glass); height: 80px; 
            display: flex; justify-content: space-between; align-items: center; padding: 0 5%; 
        }

        .logo-header { 
            font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmerEffect 5s linear infinite;
        }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        /* LANGUAGE SELECTOR - SIMETRIE INDEX */
        .lang-dropdown { position: relative; }
        .lang-current { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); 
            padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px;
        }
        .lang-list { 
            position: absolute; top: 100%; left: 0; width: 100%; background: #000; 
            border: 1px solid var(--gold); border-top: none; display: none; 
            flex-direction: column; z-index: 2100;
        }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        /* NAV SIDEBAR DESKTOP */
        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; display: flex; align-items: center; }

        /* SHOP SUBMENU - SIMETRIE INDEX (IMAGINEA 1) */
        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        
        @media (min-width: 1025px) {
            .nav-item-container:hover .submenu { display: flex; }
            .nav-link:hover { color: var(--white); }
        }

        .submenu-link { text-decoration: none; color: var(--white); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: var(--transition); }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }

        /* MAIN PENTRU CENTRARE */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 120px 5% 40px; width: 100%; }

        .contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; max-width: 1200px; width: 100%; align-items: center; }

        .contact-form-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); padding: 40px; border: 1px solid var(--glass); width: 100%; }

        .form-control { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass); padding: 15px; color: var(--white); margin-bottom: 20px; font-family: 'Montserrat'; outline: none; }
        .submit-btn { width: 100%; background: none; border: 1px solid var(--gold); color: var(--gold); padding: 18px; text-transform: uppercase; letter-spacing: 5px; cursor: pointer; transition: 0.3s; font-weight: 700; }
        .submit-btn:hover { background: var(--gold); color: #000; }

        footer { margin-top: auto; height: 80px; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); width: 100%; }
        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { text-decoration: none; font-size: 1.3rem; color: var(--gold); }
        .copyright { font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        /* OPTIMIZARE MOBIL */
        @media (max-width: 1024px) {
            header, footer { height: 70px !important; }
            .sidebar { 
                position: fixed; top: 70px; left: 0; transform: none; 
                flex-direction: column; align-items: center;
                width: 100%; padding: 20px; gap: 20px; 
                background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); z-index: 1999;
                height: auto; max-height: calc(100vh - 70px); overflow-y: auto;
            }
            .nav-item-container.active .submenu { display: flex; width: 100%; align-items: center; padding-left: 0; }
            main { padding: 160px 5% 40px; align-items: flex-start; }
            .contact-grid { grid-template-columns: 1fr; display: flex; flex-direction: column; align-items: center; }
            .contact-info { text-align: center; margin-bottom: 30px; }
            .contact-form-card { width: 100%; max-width: 450px; margin: 0 auto; padding: 30px 20px; }
            .nav-link { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail trail-gold" id="trail1"></div>
    <div class="cursor-trail trail-burgundy" id="trail2"></div>
    <div class="cursor-trail trail-terracotta" id="trail3"></div>
    <div class="cursor-trail trail-gold" id="trail4"></div>
    <div class="cursor-trail trail-burgundy" id="trail5"></div>

    <div class="fixed-bg"></div>
    
    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" class="flag-img" id="active-flag" alt="RO">
                <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')"><img src="https://flagcdn.com/w20/ro.png" class="flag-img"> RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')"><img src="https://flagcdn.com/w20/ru.png" class="flag-img"> RU</button>
                <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')"><img src="https://flagcdn.com/w20/lv.png" class="flag-img"> LV</button>
                <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')"><img src="https://flagcdn.com/w20/gb.png" class="flag-img"> EN</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <div class="nav-item-container" onclick="if(window.innerWidth <= 1024) this.classList.toggle('active')">
            <a href="javascript:void(0)" class="nav-link" id="nav-shop">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
            <div class="submenu">
                <a href="products.html" class="submenu-link" id="nav-bracelets">Brățări Energetice</a>
                <a href="digital-shop.html" class="submenu-link" id="nav-digital">Digital Shop</a>
            </div>
        </div>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main>
        <div class="contact-grid">
            <div class="contact-info">
                <h1 class="shimmer-element" id="contact-title" style="font-family:'Playfair Display', serif; font-size:3.5rem; font-style:italic; margin-bottom:20px;">Contact</h1>
                <p id="contact-sub" style="margin-bottom: 20px; font-weight: 300; opacity: 0.8;">Energia ta merită un răspuns.</p>
                <div style="font-size: 0.9rem; margin-bottom: 10px;">
                    <a href="https://wa.me/407XXXXXXXX" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 4px;">WhatsApp</a>
                </div>
            </div>

            <div class="contact-form-card">
                <form>
                    <input type="text" class="form-control" id="form-name" placeholder="Nume">
                    <input type="email" class="form-control" id="form-email" placeholder="Email">
                    <textarea class="form-control" id="form-msg" placeholder="Mesaj" style="height: 120px; resize: none;"></textarea>
                    <button type="submit" class="submit-btn" id="form-btn">Trimite</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const dot = document.getElementById('dot');
        const trails = [{el:document.getElementById('trail1'),x:0,y:0,lag:0.05},{el:document.getElementById('trail2'),x:0,y:0,lag:0.1},{el:document.getElementById('trail3'),x:0,y:0,lag:0.15},{el:document.getElementById('trail4'),x:0,y:0,lag:0.22},{el:document.getElementById('trail5'),x:0,y:0,lag:0.3}];
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px'; trails.forEach(t => t.el.style.opacity = "1"); });
        document.querySelectorAll('a, button, input, textarea').forEach(el => { el.addEventListener('mouseenter', () => dot.classList.add('glow')); el.addEventListener('mouseleave', () => dot.classList.remove('glow')); });
        function animateTrails() { trails.forEach(trail => { trail.x += (mouseX - trail.x) * trail.lag; trail.y += (mouseY - trail.y) * trail.lag; trail.el.style.left = trail.x + 'px'; trail.el.style.top = trail.y + 'px'; }); requestAnimationFrame(animateTrails); }
        animateTrails();

        const translations = {
            'ro': { home: "Acasă", consult: "Consultații", bracelets: "Brățări Energetice", digital: "Digital Shop", about: "Despre", contact: "Contact", title: "Contact", sub: "Energia ta merită un răspuns.", name: "Nume", email: "Email", msg: "Mesaj", btn: "Trimite" },
            'ru': { home: "Главная", consult: "Консультации", bracelets: "Браслеты", digital: "Цифровой магазин", about: "Обо мне", contact: "Контакт", title: "Контакт", sub: "Ваша энергия заслуживает ответа.", name: "Имя", email: "Электронная почта", msg: "Сообщение", btn: "Отправить" },
            'lv': { home: "Sākums", consult: "Konsultācijas", bracelets: "Aproces", digital: "Digitālais veikals", about: "Par mani", contact: "Kontakti", title: "Kontakti", sub: "Jūsu enerģija ir pelnījusi atbildi.", name: "Vārds", email: "E-pasts", msg: "Ziņojums", btn: "Sūtīt" },
            'en': { home: "Home", consult: "Consultations", bracelets: "Bracelets", digital: "Digital Shop", about: "About", contact: "Contact", title: "Contact", sub: "Your energy deserves a response.", name: "Name", email: "Email", msg: "Message", btn: "Send" }
        };

        function changeLang(langCode, label, flagSrc) {
            document.getElementById('active-flag').src = flagSrc;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            const content = translations[langCode];
            document.getElementById('nav-home').innerText = content.home;
            document.getElementById('nav-consult').innerText = content.consult;
            document.getElementById('nav-bracelets').innerText = content.bracelets;
            document.getElementById('nav-digital').innerText = content.digital;
            document.getElementById('nav-about').innerText = content.about;
            document.getElementById('nav-contact').innerText = content.contact;
            document.getElementById('contact-title').innerText = content.title;
            document.getElementById('contact-sub').innerText = content.sub;
            document.getElementById('form-name').placeholder = content.name;
            document.getElementById('form-email').placeholder = content.email;
            document.getElementById('form-msg').placeholder = content.msg;
            document.getElementById('form-btn').innerText = content.btn;
        }

        window.onclick = function(event) { if (!event.target.closest('.lang-dropdown')) { const list = document.getElementById('lang-list'); if (list) list.classList.remove('show'); } }
    </script>
</body>
</html>
