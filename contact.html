<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --hermes-terracotta: #d35400; 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* RESET & SCROLL */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        html { scroll-behavior: smooth; }
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* CURSOR STEA */
        .cursor-dot { 
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999; 
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), 0 0 30px 10px rgba(197, 160, 89, 0.5);
            animation: slowStarPulse 6s infinite ease-in-out;
            transition: box-shadow 0.5s ease;
        }
        .cursor-dot::before, .cursor-dot::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            animation: rayShimmer 5s infinite ease-in-out alternate;
        }
        .cursor-dot::before { width: 70px; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        .cursor-dot::after { width: 1px; height: 70px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        .cursor-dot.glow { box-shadow: 0 0 15px 4px rgba(255, 255, 255, 1), 0 0 50px 15px rgba(197, 160, 89, 0.7); }
        @keyframes slowStarPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        @keyframes rayShimmer { 0% { opacity: 0.6; scale: 0.95; } 100% { opacity: 1; scale: 1.05; } }

        /* BACKGROUND */
        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background-color: #000;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; 
            background-size: cover; 
            will-change: transform; transform: translateZ(0);
            animation: cinematicZoom 45s infinite alternate ease-in-out; 
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* PARTICLES */
        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px var(--gold); border-radius: 50%; opacity: 0.8; will-change: transform; }

        /* HEADER */
        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 5%; 
        }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .menu-toggle { display: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; z-index: 2200; }
        .logo-header { 
            font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; right: 0; width: 100%; background: #000; border: 1px solid var(--gold); border-top: none; display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        /* NAV DESKTOP */
        .desktop-nav { display: flex; gap: 2.5rem; align-items: center; justify-content: center; height: 40px; margin-top: 5px; }
        .nav-link, .submenu-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; transition: var(--transition); white-space: nowrap; }
        .nav-link:hover, .submenu-link:hover { color: var(--white); }
        .nav-item-container { position: relative; height: 100%; display: flex; align-items: center; }
        .submenu { 
            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.95); border: 1px solid var(--gold); min-width: 220px; 
            padding: 20px; flex-direction: column; gap: 15px; z-index: 2100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-item-container:hover .submenu { display: flex; }

        /* MARQUEE SUB HEADER */
        .marquee-section {
            width: 100%; margin-top: 80px; background: rgba(0, 0, 0, 0.4); 
            border-bottom: 1px solid rgba(197, 160, 89, 0.2); padding: 15px 0;
            overflow: hidden; white-space: nowrap; position: relative; z-index: 10;
        }
        .marquee-content { display: inline-block; animation: marquee 40s linear infinite; }
        .marquee-item { display: inline-block; color: var(--gold); font-size: 0.7rem; letter-spacing: 6px; text-transform: uppercase; margin: 0 40px; opacity: 0.8; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* PAGE CONTAINER */
        .page-container {
            padding: 100px 5% 120px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; width: 100%; align-items: center; }

        .contact-info-panel { text-align: left; }
        .shimmer-title { 
            font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 4rem); font-style: italic; margin-bottom: 20px; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmerEffect 5s linear infinite;
        }
        .contact-sub { font-weight: 300; opacity: 0.8; margin-bottom: 30px; letter-spacing: 1px; }

        .whatsapp-link { 
            display: inline-block; color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold); 
            padding-bottom: 4px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .whatsapp-link:hover { color: var(--white); border-color: var(--white); }

        /* FORM CARD */
        .contact-form-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); padding: 50px; 
            border: 1px solid rgba(197, 160, 89, 0.2); transition: var(--transition);
        }
        .contact-form-card:hover { border-color: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        .form-control { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(197, 160, 89, 0.2); 
            padding: 18px; color: var(--white); margin-bottom: 25px; font-family: 'Montserrat'; 
            outline: none; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--gold); background: rgba(0,0,0,0.5); }

        .submit-btn { 
            width: 100%; background: none; border: 1px solid var(--gold); color: var(--gold); 
            padding: 18px; text-transform: uppercase; letter-spacing: 5px; cursor: pointer; 
            transition: 0.4s; font-weight: 700; font-size: 0.8rem;
        }
        .submit-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px rgba(197, 160, 89, 0.4); }

        /* FOOTER */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 2000; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; font-size: 1.2rem; }
        .social-links a { color: var(--gold); transition: 0.3s; text-decoration: none; }
        .copyright { font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        /* MOBILE STYLES */
        @media (max-width: 1024px) {
            .cursor-dot { display: none !important; }
            * { cursor: auto !important; }
            header { height: 80px; flex-direction: row; justify-content: space-between; }
            .menu-toggle { display: block; }
            
            .desktop-nav { 
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
                background: rgba(0,0,0,0.95); backdrop-filter: blur(15px); 
                flex-direction: column; justify-content: flex-start; align-items: center; 
                opacity: 0; visibility: hidden; transition: 0.5s ease; z-index: 2100; 
                padding-top: 100px; padding-bottom: 50px; overflow-y: auto;
            }
            .desktop-nav.active { opacity: 1; visibility: visible; }
            
            .nav-link { width: 100%; text-align: center; padding: 25px 0; font-size: 1.1rem; display: block; }
            .nav-item-container { width: 100%; flex-direction: column; height: auto; align-items: center; display: block; }
            
            .submenu { position: static; transform: none; background: rgba(197, 160, 89, 0.05); border: none; width: 100%; display: none; padding: 0; gap: 0; box-shadow: none; }
            .nav-item-container.active-mobile .submenu { display: flex; }
            .submenu-link { width: 100%; text-align: center; padding: 20px 0; font-size: 0.95rem; opacity: 0.8; display: block; border-top: 1px solid rgba(197, 160, 89, 0.1); }

            .marquee-item { font-size: 0.6rem; letter-spacing: 3px; margin: 0 20px; }
            .page-container { padding-top: 60px; }
            .contact-grid { grid-template-columns: 1fr; text-align: center; }
            .contact-info-panel { margin-bottom: 40px; }
            .contact-form-card { padding: 30px 20px; }

            footer { position: relative; }
        }
    </style>
</head>
<body>
    <div id="particles-container"></div>
    <div class="cursor-dot" id="dot"></div>
    <div class="fixed-bg"></div>

    <header>
        <div class="header-top">
            <div class="menu-toggle" id="menuBtn"><i class="fas fa-bars"></i></div>
            <a href="index.html" class="logo-header">The Power Boutique</a>
            <div class="lang-dropdown">
                <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                    <img src="https://flagcdn.com/w20/ro.png" class="flag-img" id="active-flag"> 
                    <span id="active-lang">RO</span> 
                    <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 5px;"></i>
                </button>
                <div class="lang-list" id="lang-list">
                    <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')"><img src="https://flagcdn.com/w20/ro.png" class="flag-img"> RO</button>
                    <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')"><img src="https://flagcdn.com/w20/ru.png" class="flag-img"> RU</button>
                    <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')"><img src="https://flagcdn.com/w20/lv.png" class="flag-img"> LV</button>
                    <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')"><img src="https://flagcdn.com/w20/gb.png" class="flag-img"> EN</button>
                </div>
            </div>
        </div>

        <nav class="desktop-nav" id="sidebar">
            <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
            <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
            <div class="nav-item-container" id="shopContainer">
                <a href="javascript:void(0)" class="nav-link" id="nav-shop">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
                <div class="submenu">
                    <a href="products.html" class="submenu-link" id="nav-bracelets">Brățări Energetice</a>
                    <a href="digital-shop.html" class="submenu-link" id="nav-digital">Digital Shop</a>
                </div>
            </div>
            <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
            <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
        </nav>
    </header>

    <div class="marquee-section">
        <div class="marquee-content">
            <span class="marquee-item">ENERGY</span>• <span class="marquee-item">LUXURY</span>• <span class="marquee-item">POWER</span>• <span class="marquee-item">BALANCE</span>• <span class="marquee-item">HARMONY</span>• <span class="marquee-item">INTENTION</span>• <span class="marquee-item">ENERGY</span>• <span class="marquee-item">LUXURY</span>• <span class="marquee-item">POWER</span>• <span class="marquee-item">BALANCE</span>• <span class="marquee-item">HARMONY</span>• <span class="marquee-item">INTENTION</span>
        </div>
    </div>

    <main class="page-container">
        <div class="contact-grid">
            <div class="contact-info-panel">
                <h1 class="shimmer-title" id="contact-title">Contact</h1>
                <p class="contact-sub" id="contact-sub">Energia ta merită un răspuns.</p>
                <a href="https://wa.me/407XXXXXXXX" target="_blank" class="whatsapp-link">WhatsApp</a>
            </div>

            <div class="contact-form-card">
                <form>
                    <input type="text" class="form-control" id="form-name" placeholder="Nume">
                    <input type="email" class="form-control" id="form-email" placeholder="Email">
                    <textarea class="form-control" id="form-msg" placeholder="Mesaj" style="height: 150px; resize: none;"></textarea>
                    <button type="submit" class="submit-btn" id="form-btn">Trimite</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        // --- TRANSLATIONS ---
        const translations = {
            'ro': { home: "Acasă", consult: "Consultații", bracelets: "Brățări Energetice", digital: "Digital Shop", about: "Despre", contact: "Contact", title: "Contact", sub: "Energia ta merită un răspuns.", name: "Nume", email: "Email", msg: "Mesaj", btn: "Trimite" },
            'ru': { home: "Главная", consult: "Консультации", bracelets: "Браслеты", digital: "Цифровой магазин", about: "Обо мне", contact: "Контакт", title: "Контакт", sub: "Ваша энергия заслуживает ответа.", name: "Имя", email: "Эл. почта", msg: "Сообщение", btn: "Отправить" },
            'lv': { home: "Sākums", consult: "Konsultācijas", bracelets: "Aproces", digital: "Digitālais veikals", about: "Par mani", contact: "Kontakti", title: "Kontakti", sub: "Jūsu enerģija ir pelnījusi atbildi.", name: "Vārds", email: "E-pasts", msg: "Ziņojums", btn: "Sūtīt" },
            'en': { home: "Home", consult: "Consultations", bracelets: "Bracelets", digital: "Digital Shop", about: "About", contact: "Contact", title: "Contact", sub: "Your energy deserves a response.", name: "Name", email: "Email", msg: "Message", btn: "Send" }
        };

        function changeLang(code, label, flag) {
            document.getElementById('active-flag').src = flag;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            const t = translations[code];
            if(!t) return;
            document.getElementById('nav-home').innerText = t.home;
            document.getElementById('nav-consult').innerText = t.consult;
            document.getElementById('nav-bracelets').innerText = t.bracelets;
            document.getElementById('nav-digital').innerText = t.digital;
            document.getElementById('nav-about').innerText = t.about;
            document.getElementById('nav-contact').innerText = t.contact;
            document.getElementById('contact-title').innerText = t.title;
            document.getElementById('contact-sub').innerText = t.sub;
            document.getElementById('form-name').placeholder = t.name;
            document.getElementById('form-email').placeholder = t.email;
            document.getElementById('form-msg').placeholder = t.msg;
            document.getElementById('form-btn').innerText = t.btn;
        }

        // --- PARTICLES ---
        const particleContainer = document.getElementById('particles-container');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 3 + 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.element = document.createElement('div');
                this.element.classList.add('particle');
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                particleContainer.appendChild(this.element);
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > window.innerWidth || this.x < 0) this.speedX = -this.speedX;
                if (this.y > window.innerHeight || this.y < 0) this.speedY = -this.speedY;
                if (mouse.x != null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        const forceDirectionX = dx / distance; const forceDirectionY = dy / distance;
                        const force = (mouse.radius - distance) / mouse.radius;
                        this.x += forceDirectionX * force * 3; this.y += forceDirectionY * force * 3;
                    }
                }
                this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
            }
        }

        function initParticles() {
            particles = []; particleContainer.innerHTML = '';
            let n = window.innerWidth < 768 ? 35 : 50;
            for (let i = 0; i < n; i++) particles.push(new Particle());
        }
        function animateParticles() { particles.forEach(p => p.update()); requestAnimationFrame(animateParticles); }

        initParticles(); animateParticles();
        window.addEventListener('resize', initParticles);

        // --- INTERACTION ---
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        const shopContainer = document.getElementById('shopContainer');
        const dot = document.getElementById('dot');

        menuBtn.onclick = () => { 
            sidebar.classList.toggle('active'); 
            menuBtn.innerHTML = sidebar.classList.contains('active') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>'; 
        };

        shopContainer.onclick = (e) => { 
            if(window.innerWidth <= 1024) { e.stopPropagation(); shopContainer.classList.toggle('active-mobile'); } 
        };

        function updatePos(e) {
            let x, y;
            if (e.touches) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
            else { x = e.clientX; y = e.clientY; }
            mouse.x = x; mouse.y = y;
            if (window.innerWidth > 1024 && dot) { dot.style.left = x + 'px'; dot.style.top = y + 'px'; }
        }

        window.addEventListener('mousemove', updatePos);
        window.addEventListener('touchstart', updatePos, { passive: true });
        window.addEventListener('touchmove', updatePos, { passive: true });

        document.querySelectorAll('a, button, input, textarea').forEach(el => {
            el.addEventListener('mouseenter', () => { if (window.innerWidth > 1024 && dot) dot.classList.add('glow'); });
            el.addEventListener('mouseleave', () => { if (window.innerWidth > 1024 && dot) dot.classList.remove('glow'); });
        });

        window.onclick = (e) => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); };
    </script>
</body>
</html>
