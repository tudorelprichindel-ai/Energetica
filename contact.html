<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        html, body { height: 100%; }
        body { 
            display: flex; flex-direction: column;
            width: 100%; background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.8; -webkit-font-smoothing: antialiased;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
        }

        /* HEADER & FOOTER - SIMETRIE PERFECTA */
        header, footer {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        header { position: fixed; top: 0; border-bottom: 1px solid var(--glass); }

        footer {
            margin-top: auto; 
            border-top: 1px solid var(--wine);
            flex-direction: column;
            padding: 10px 0;
        }

        /* EFECTUL SHIMMER */
        .shimmer-element {
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }

        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .logo-header {
            font-family: 'Playfair Display', serif; font-style: italic;
            text-decoration: none; font-size: 1.3rem; letter-spacing: 4px; font-weight: 700;
        }

        /* SIDEBAR DESKTOP */
        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700;
        }
        .nav-link:hover { transform: translateX(10px); color: var(--white); }

        /* CONTINUT */
        main { flex: 1; padding: 160px 8% 80px; max-width: 1200px; margin: 0 auto; width: 100%; }

        .contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: start; }

        .contact-info h1 {
            font-family: 'Playfair Display', serif; font-size: 3rem; 
            color: var(--gold); font-style: italic; margin-bottom: 25px;
        }

        .contact-form-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            padding: 40px; border: 1px solid var(--glass);
        }

        .form-control {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass);
            padding: 12px; color: var(--white); margin-bottom: 15px; font-family: 'Montserrat';
        }

        .submit-btn {
            width: 100%; background: none; border: 1px solid var(--gold);
            color: var(--gold); padding: 15px; text-transform: uppercase;
            letter-spacing: 5px; cursor: pointer; transition: 0.3s; font-weight: 700;
        }
        .submit-btn:hover { background: var(--gold); color: #000; }

        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { text-decoration: none; font-size: 1.2rem; transition: var(--transition); }
        .copyright { font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        /* OPTIMIZARE MOBILA */
        @media (max-width: 900px) {
            header, footer { height: 70px; }
            
            .sidebar {
                position: relative; top: 0; left: 0; transform: none;
                flex-direction: row; flex-wrap: wrap; justify-content: center;
                margin-top: 80px; padding: 20px 10px; gap: 1rem;
                background: rgba(0, 0, 0, 0.4); width: 100%;
                border-bottom: 1px solid var(--glass);
            }
            
            main { padding: 30px 20px 60px; }
            
            .contact-grid { grid-template-columns: 1fr; gap: 40px; text-align: center; }
            
            .contact-info h1 { font-size: 2.5rem; }
            
            .contact-form-card { padding: 30px 20px; }
            
            .nav-link { font-size: 0.65rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main>
        <div class="contact-grid">
            <div class="contact-info">
                <h1>Contact</h1>
                <p style="margin-bottom: 20px; font-weight: 300; opacity: 0.8;">Alege canalul tău de manifestare.</p>
                <div style="font-size: 0.9rem; margin-bottom: 10px;">
                    <a href="https://wa.me/407XXXXXXXX" style="color: var(--gold); text-decoration: none;">WhatsApp Direct</a>
                </div>
                <div style="font-size: 0.9rem;">
                    <a href="https://t.me/elena_shipko" style="color: var(--gold); text-decoration: none;">Telegram: @elena_shipko</a>
                </div>
            </div>

            <div class="contact-form-card">
                <form>
                    <input type="text" class="form-control" placeholder="Nume">
                    <input type="email" class="form-control" placeholder="Email">
                    <textarea class="form-control" placeholder="Mesajul tău" style="height: 100px; resize: none;"></textarea>
                    <button type="submit" class="submit-btn">Trimite Intenția</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
