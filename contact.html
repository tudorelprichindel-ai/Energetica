<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Contact | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* STRUCTURA PENTRU FOOTER JOS */
        html, body { height: 100%; }
        body { 
            display: flex; flex-direction: column;
            width: 100%; background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.8; -webkit-font-smoothing: antialiased;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
        }

        /* HEADER UNIFORMIZAT */
        header {
            position: fixed; top: 0; width: 100%; z-index: 2000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass); height: 80px;
            display: flex; justify-content: center; align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif; font-style: italic;
            text-decoration: none; font-size: 1.3rem; letter-spacing: 4px; font-weight: 700;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmer 5s linear infinite;
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        /* SIDEBAR / NAV */
        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.7rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700;
        }
        .nav-link:hover { transform: translateX(10px); color: var(--white); }

        /* CONTAINERUL PRINCIPAL PINGE FOOTERUL */
        main { flex: 1; padding-top: 180px; }

        .contact-container {
            padding: 0 8% 100px; max-width: 1200px; margin: 0 auto;
        }

        .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 80px; align-items: start; }

        /* FOOTER UNIFORMIZAT */
        footer {
            width: 100%; padding: 60px 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); border-top: 1px solid var(--wine);
        }
        .social-links { margin-bottom: 20px; }
        .social-links a { color: var(--gold); margin: 0 15px; font-size: 1.5rem; transition: 0.3s; }
        .social-links a:hover { color: #fff; transform: scale(1.1); }
        .copyright { font-size: 0.65rem; letter-spacing: 3px; color: rgba(255,255,255,0.5); text-transform: uppercase; }

        /* FORMULAR STILIZAT */
        .contact-form-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px);
            padding: 50px; border: 1px solid var(--glass);
        }
        .form-control {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass);
            padding: 15px; color: var(--white); margin-bottom: 25px;
        }
        .submit-btn {
            width: 100%; background: none; border: 1px solid var(--gold);
            color: var(--gold); padding: 20px; text-transform: uppercase;
            letter-spacing: 5px; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background: var(--gold); color: #000; }

        /* RESPONSIVITATE UNIFORMA */
        @media (max-width: 900px) {
            header { height: 70px; }
            .sidebar {
                position: relative; top: 0; left: 0; transform: none;
                flex-direction: row; flex-wrap: wrap; justify-content: center;
                margin-top: 80px; padding: 25px 15px; gap: 1.2rem;
                background: rgba(0, 0, 0, 0.5); width: 100%; z-index: 1500;
                border-bottom: 1px solid var(--glass);
            }
            main { padding-top: 40px; }
            .contact-grid { grid-template-columns: 1fr; gap: 50px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main>
        <div class="contact-container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold); font-style: italic; margin-bottom: 30px;">Contact</h1>
                    <p style="margin-bottom: 40px; font-weight: 300; opacity: 0.8;">Aștept cu drag mesajul tău pentru a începe călătoria manifestării.</p>
                    <p>WhatsApp: <a href="https://wa.me/407XXXXXXXX" style="color: var(--gold); text-decoration: none;">+40 7XX XXX XXX</a></p>
                    <p>Telegram: <a href="https://t.me/elena_shipko" style="color: var(--gold); text-decoration: none;">@elena_shipko</a></p>
                </div>

                <div class="contact-form-card">
                    <form>
                        <input type="text" class="form-control" placeholder="Nume">
                        <input type="email" class="form-control" placeholder="Email">
                        <textarea class="form-control" placeholder="Mesaj" style="height: 150px; resize: none;"></textarea>
                        <button type="submit" class="submit-btn">Trimite</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
