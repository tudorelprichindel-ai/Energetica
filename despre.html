<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Despre | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --wine: #5e1914; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }

        /* DROPDOWN LIMBI COMPACT CU STEAG APROPIAT */
        .lang-dropdown { position: relative; display: inline-block; }
        .lang-current { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); 
            padding: 8px 12px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; 
            text-transform: uppercase; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 0 -2px var(--gold), 0 8px 0 -4px var(--gold);
        }
        .lang-list { position: absolute; top: calc(100% + 12px); right: 0; background: rgba(0, 0, 0, 0.95); border: 1px solid var(--gold); min-width: 90px; display: none; flex-direction: column; z-index: 2100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .lang-list.show { display: flex; }
        .lang-btn { background: none; border: none; color: var(--white); padding: 10px 12px; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 8px; transition: 0.3s; }
        .lang-btn img { width: 16px; opacity: 0.8; }
        .lang-btn:hover { background: rgba(197, 160, 89, 0.2); color: var(--gold); }

        .sidebar { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .shimmer-element { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .about-container { padding: 180px 8% 120px; max-width: 1600px; margin: 0 auto; width: 100%; }
        .about-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
        
        .about-image-wrapper { position: relative; display: flex; justify-content: center; -webkit-mask-image: radial-gradient(circle at 50% 30%, black 50%, transparent 95%); mask-image: radial-gradient(circle at 50% 30%, black 50%, transparent 95%); }
        .about-image-wrapper img { width: 100%; max-width: 550px; display: block; filter: contrast(1.1); }
        
        .about-text-card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); padding: 50px; border-left: 2px solid var(--gold); }
        .about-text-card p { font-size: 1.05rem; margin-bottom: 20px; line-height: 1.8; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .signature { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--gold); font-style: italic; margin-top: 30px; }

        footer { height: 80px; border-top: 1px solid var(--wine); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); }

        @media (max-width: 850px) {
            header { height: 70px; }
            .sidebar { position: fixed; top: 70px; left: 0; transform: none; flex-direction: row; justify-content: center; padding: 15px; gap: 1rem; background: rgba(0, 0, 0, 0.85); width: 100%; z-index: 1900; border-bottom: 1px solid var(--glass); }
            .about-container { padding: 140px 20px 80px; }
            .about-hero { grid-template-columns: 1fr; }
            .about-text-card { padding: 35px 25px; border-left: none; border-top: 2px solid var(--gold); text-align: center; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" id="current-lang-btn" onclick="toggleLangList()">
                <span id="current-lang-text">RO</span>
                <i class="fas fa-chevron-down" style="font-size: 0.6rem; opacity: 0.6;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button onclick="selectLang('ru')" class="lang-btn"><img src="https://flagcdn.com/w20/ru.png" alt=""> RU</button>
                <button onclick="selectLang('lv')" class="lang-btn"><img src="https://flagcdn.com/w20/lv.png" alt=""> LV</button>
                <button onclick="selectLang('en')" class="lang-btn"><img src="https://flagcdn.com/w20/gb.png" alt=""> EN</button>
                <button onclick="selectLang('ro')" class="lang-btn"><img src="https://flagcdn.com/w20/ro.png" alt=""> RO</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <a href="products.html" class="nav-link" id="nav-shop">Shop</a>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main class="about-container">
        <div class="about-hero">
            <div class="about-image-wrapper"><img src="6.jpg" alt="Jelena Shipko"></div>
            <div class="about-content">
                <div class="about-text-card">
                    <span id="sub-title" style="color:var(--gold);letter-spacing:8px;text-transform:uppercase;font-size:0.8rem;display:block;margin-bottom:20px;">Viziune & Creație</span>
                    <h1 class="shimmer-element" id="main-title" style="font-family:'Playfair Display',serif;font-size:clamp(2.5rem,5vw,4rem);font-style:italic;margin-bottom:30px;">Inima Din Spatele Puterii</h1>
                    <div id="text-content"></div>
                    <div class="signature">Jelena Shipko</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links" style="display:flex; gap:20px; margin-bottom:5px; font-size:1.2rem;">
            <a href="#" style="color:var(--gold);"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#" style="color:var(--gold);"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank" style="color:var(--gold);"><i class="fab fa-telegram-plane shimmer-element"></i></a>
        </div>
        <p style="font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const translations = {
            ro: { home:"Acasă", consult:"Consultații", shop:"Shop", about:"Despre", contact:"Contact", sub:"Viziune & Creație", title:"Inima Din Spatele Puterii", content:"<p>Fiecare pas este o oportunitate de a ne alinia cu frecvența succesului. Prin <span style='color:var(--gold);font-weight:600;'>The Power Boutique</span>, am creat o punte între dorință și instrumentele energetice necesare.</p><p>Misiunea mea capătă formă prin brățările energetice pe care le proiectez personal.</p>" },
            ru: { home:"Главная", consult:"Консультации", shop:"Магазин", about:"Обо мне", contact:"Контакт", sub:"Видение и Творчество", title:"Сердце за Силой", content:"<p>Каждый шаг — это шанс настроиться на успех. С <span style='color:var(--gold);font-weight:600;'>The Power Boutique</span> я создала мост между желанием и инструментами.</p><p>Моя миссия воплощается в энергетических браслетах, которые я создаю лично.</p>" },
            lv: { home:"Sākums", consult:"Konsultācijas", shop:"Veikals", about:"Par mani", contact:"Kontakti", sub:"Vīzija un jaunrade", title:"Sirds aiz spēka", content:"<p>Katrs solis ir iespēja pieskaņoties panākumiem. Ar <span style='color:var(--gold);font-weight:600;'>The Power Boutique</span> esmu radījusi tiltu starp vēlmi mirdzēt un enerģijas rīkiem.</p><p>Mana misija izpaužas enerģētiskajās aprocēs harmonijai.</p>" },
            en: { home:"Home", consult:"Consultations", shop:"Shop", about:"About", contact:"Contact", sub:"Vision & Creation", title:"The Heart Behind Power", content:"<p>Every step we take is an opportunity to align with success. Through <span style='color:var(--gold);font-weight:600;'>The Power Boutique</span>, I created a bridge between desire and energy tools.</p><p>I design energy bracelets to harmonize the wearer's vibration.</p>" }
        };

        function toggleLangList() { document.getElementById('lang-list').classList.toggle('show'); }
        function selectLang(lang) {
            document.getElementById('current-lang-text').innerText = lang.toUpperCase();
            document.getElementById('lang-list').classList.remove('show');
            changeLang(lang);
        }
        function changeLang(lang) {
            ['home','consult','shop','about','contact'].forEach(id => document.getElementById('nav-'+id).innerText = translations[lang][id]);
            document.getElementById('sub-title').innerText = translations[lang].sub;
            document.getElementById('main-title').innerText = translations[lang].title;
            document.getElementById('text-content').innerHTML = translations[lang].content;
        }
        window.onclick = e => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); }
        window.onload = () => selectLang('ro');
    </script>
</body>
</html>
