<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Power Boutique | Jelena Shipko</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --dark-glow: 0 0 25px rgba(0, 0, 0, 0.95), 2px 2px 10px rgba(0, 0, 0, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
            animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass);
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif;
            text-decoration: none;
            font-size: 1.3rem;
            letter-spacing: 3px;
            font-weight: 700;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }

        @keyframes shimmerEffect {
            to { background-position: 200% center; }
        }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700; display: block;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 20px 20px 150px;
            position: relative;
            transform: translateY(-5%);
        }

        /* TEXT MĂRIT: Jelena Shipko */
        .name-top {
            color: var(--wine);
            letter-spacing: 12px; 
            text-transform: uppercase;
            font-size: 1.2rem; /* Mărit de la 1rem */
            font-weight: 700; 
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* TEXT MĂRIT: The Power Boutique */
        .hero h1 {
            font-family: 'Playfair Display', serif; 
            font-size: clamp(3rem, 10vw, 6rem); /* Mărit de la 2.5rem-5rem */
            color: var(--gold);
            margin-bottom: 35px; 
            letter-spacing: 4px; 
            font-weight: 700;
            line-height: 1.1;
            max-width: 1200px;
            text-shadow: var(--dark-glow);
        }

        .roles-bottom {
            color: var(--gold); 
            letter-spacing: 4px; 
            text-transform: uppercase;
            font-size: 0.85rem; 
            font-weight: 700;
            margin-top: 10px;
            text-shadow: var(--dark-glow);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .roles-bottom a {
            color: inherit;
            text-decoration: none;
            transition: var(--transition);
            padding: 5px 12px;
            display: inline-block;
        }

        .roles-bottom a:hover {
            color: var(--white);
            transform: translateY(-3px);
            text-shadow: 0 0 15px var(--gold), var(--dark-glow);
        }

        .dot { opacity: 0.5; pointer-events: none; margin: 0 5px; }

        footer {
            position: fixed; bottom: 0; width: 100%;
            padding: 40px 20px; text-align: center; background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px); border-top: 1px solid var(--wine);
        }
        .social-links { margin-bottom: 15px; }
