<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --hermes-terracotta: rgba(211, 84, 0, 0.4); 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* CURSOR DIAMANT */
        .cursor-dot {
            width: 10px; height: 10px; background: var(--gold);
            position: fixed; pointer-events: none; z-index: 9999; 
            transition: width 0.3s, height 0.3s, background 0.3s, box-shadow 0.3s;
        }

        /* EFECT FUM SUBTIL ȘI LUNG */
        .cursor-trail {
            position: fixed; pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%); opacity: 0;
            width: 60px; height: 60px;
            /* Textură de fum creată din gradient */
            background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, rgba(197, 160, 89, 0.05) 40%, transparent 70%);
            filter: blur(8px);
            transition: opacity 1.5s ease-out;
            animation: smokeRise 5s infinite ease-out;
        }

        @keyframes smokeRise {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: translate(-50%, -120%) scale(2.5) rotate(90deg); opacity: 0; }
        }

        .cursor-dot.glow { width: 14px; height: 14px; box-shadow: 0 0 15px 5px var(--gold); background: #fff; }

        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') center center / cover no-repeat; 
            animation: cinematicZoom 25s infinite alternate ease-in-out; 
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; 
        }

        .logo-header { 
            font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmerEffect 5s linear infinite;
        }

        .lang-dropdown { position: relative; }
        .lang-current { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); 
            padding: 8px 12px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
        }

        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; }

        .main-container { padding: 120px 5% 100px; width: 100%; display: flex; flex-direction: column; align-items: center; }

        .about-hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; width: 100%; max-width: 1200px; gap: 60px; }
        .about-text-card { background: rgba(0,0,0,0.4); backdrop-filter: blur(20px); padding: 50px; border-left: 2px solid var(--burgundy); }

        .aura-btn { 
            display: inline-block; background: transparent; border: 1px solid var(--gold); color: var(--gold); 
            padding: 12px 35px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; font-size: 0.7rem; 
            text-decoration: none; position: relative;
        }

        @media (max-width: 1024px) {
            .about-hero { grid-template-columns: 1fr; text-align: center; }
            .sidebar { position: fixed; top: 80px; left: 0; transform: none; flex-direction: row; flex-wrap: wrap; justify-content: center; width: 100%; padding: 15px 10px; gap: 15px; background: var(--hermes-terracotta); z-index: 1999; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail" id="trail1"></div>
    <div class="cursor-trail" id="trail2"></div>
    <div class="cursor-trail" id="trail3"></div>
    <div class="cursor-trail" id="trail4"></div>
    <div class="cursor-trail" id="trail5"></div>
    <div class="cursor-trail" id="trail6"></div>

    <div class="fixed-bg"></div>

    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current">RO</button>
        </div>
    </header>

    <main class="main-container">
        <nav class="sidebar">
            <a href="index.html" class="nav-link">Acasă</a>
            <a href="programari.html" class="nav-link">Consultații</a>
            <a href="products.html" class="nav-link">Shop</a>
            <a href="despre.html" class="nav-link">Despre</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>

        <section class="about-hero">
            <div class="about-image-wrapper"><img src="6.jpg" alt="Jelena" style="width:100%;"></div>
            <div class="about-text-card">
                <h2>Inima Din Spatele Puterii</h2>
                <p>Fiecare pas este o oportunitate de a ne alinia cu frecvența succesului.</p>
                <a href="despre.html" class="aura-btn">Află Povestea</a>
            </div>
        </section>
    </main>

    <script>
        const dot = document.getElementById('dot');
        const trails = [
            { el: document.getElementById('trail1'), x: 0, y: 0, lag: 0.05 },
            { el: document.getElementById('trail2'), x: 0, y: 0, lag: 0.1 },
            { el: document.getElementById('trail3'), x: 0, y: 0, lag: 0.15 },
            { el: document.getElementById('trail4'), x: 0, y: 0, lag: 0.2 },
            { el: document.getElementById('trail5'), x: 0, y: 0, lag: 0.25 },
            { el: document.getElementById('trail6'), x: 0, y: 0, lag: 0.3 }
        ];

        let mouseX = 0, mouseY = 0;

        function updateCoords(e) {
            if (e.touches && e.touches.length > 0) {
                mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
            } else {
                mouseX = e.clientX; mouseY = e.clientY;
            }
            dot.style.transform = `translate(-50%, -50%) rotate(45deg)`;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
            trails.forEach(t => t.el.style.opacity = "1");
        }

        window.addEventListener('mousemove', updateCoords);
        window.addEventListener('touchmove', updateCoords, { passive: true });

        function animateTrails() {
            trails.forEach(trail => {
                trail.x += (mouseX - trail.x) * trail.lag;
                trail.y += (mouseY - trail.y) * trail.lag;
                trail.el.style.left = trail.x + 'px'; trail.el.style.top = trail.y + 'px';
            });
            requestAnimationFrame(animateTrails);
        }
        animateTrails();
    </script>
</body>
</html>
