<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energetica | Elena Shipko</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --midnight: #0a0e14;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            min-height: 100vh; 
            font-family: 'Montserrat', sans-serif; 
            color: var(--white); 
            background: #000; 
            overflow-x: hidden; 
        }

        /* FUNDAL CINEMATIC */
        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('cristale.jpg') no-repeat center center;
            background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* LOGO - POZIȚIONAT SUS CENTRU SAU STÂNGA */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%; padding: 2rem; z-index: 1001;
            pointer-events: none; /* Permite click-ul prin container la elementele de dedesubt */
        }
        .logo {
            pointer-events: auto;
            font-family: 'Playfair Display', serif; font-size: 1.5rem;
            color: var(--gold); text-decoration: none; letter-spacing: 4px; font-weight: bold;
            display: inline-block;
        }

        /* SIDEBAR MENU (STÂNGA) */
        .sidebar {
            position: fixed;
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            border-left: 1px solid var(--glass);
            padding-left: 1.5rem;
        }

        .nav-item {
            list-style: none;
            position: relative;
        }

        .nav-link {
            text-decoration: none;
            color: var(--gold);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: var(--transition);
            display: block;
            padding: 0.5rem 0;
            opacity: 0.7;
        }

        .nav-link:hover {
            color: var(--white);
            opacity: 1;
            transform: translateX(10px);
        }

        /* HERO SECTION - AJUSTATĂ PENTRU MENIU LATERAL */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10% 0 15%; /* Spatiu mai mare in stanga pentru meniu */
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 5rem);
            color: var(--gold); margin-bottom: 20px; letter-spacing: 2px;
            line-height: 1.2;
        }

        .btn-main {
            padding: 18px 50px; border: 1px solid var(--gold); color: var(--gold);
            text-decoration: none; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 4px; transition: 0.4s;
            margin-top: 30px;
        }

        .btn-main:hover {
            background: var(--gold); color: #000; box-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
        }

        /* FOOTER CU REȚELE SOCIALE */
        footer {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
        }

        .social-links { display: flex; flex-direction: column; gap: 20px; }
        .social-links a { color: var(--gold); font-size: 1.2rem; transition: 0.3s; opacity: 0.6; }
        .social-links a:hover { opacity: 1; transform: scale(1.2); color: white; }

        /* RESPONSIVE PENTRU MOBIL */
        @media (max-width: 768px) {
            .sidebar {
                left: 1rem;
                padding-left: 1rem;
            }
            .hero { padding: 0 20px; }
            .nav-link { font-size: 0.7rem; letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <div class="fixed-bg"></div>

    <div class="top-bar">
        <a href="index.html" class="logo">ENERGETICA</a>
    </div>

    <nav class="sidebar">
        <div class="nav-item">
            <a href="index.html" class="nav-link">Acasă</a>
        </div>
        <div class="nav-item">
            <a href="programari.html" class="nav-link">Consultații Astrologice</a>
        </div>
        <div class="nav-item">
            <a href="products.html" class="nav-link">Shop</a>
        </div>
        <div class="nav-item">
            <a href="contact.html" class="nav-link">Contact</a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1>Astrology Power Boutique</h1>
            <p style="color: var(--gold); letter-spacing: 5px; text-transform: uppercase; font-size: 0.8rem;">
                Elena Shipko • NLP Master • Business Strategist
            </p>
            <a href="programari.html" class="btn-main">Solicită Audit</a>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/37127507367" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
    </footer>

</body>
</html>
