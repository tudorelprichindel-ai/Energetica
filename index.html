<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; --burgundy: #5e1914; --white: #ffffff; 
            --hermes-terracotta: #d35400; --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; touch-action: none; }

        /* CURSOR OPTIMIZAT PENTRU MOBIL */
        .cursor-dot { 
            width: 25px; height: 25px; background-image: url('diamond-graphic-clipart-design-free-png.webp'); 
            background-size: contain; background-repeat: no-repeat; background-position: center; 
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; 
            will-change: transform; transform: translate3d(-50%, -50%, 0);
        }

        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out; }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* HEADER */
        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 100px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 5%; 
        }

        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .desktop-nav { display: flex; gap: 2.5rem; align-items: center; justify-content: center; width: 100%; padding-bottom: 5px; }
        .nav-link, .submenu-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; transition: var(--transition); white-space: nowrap; }
        .nav-link:hover, .submenu-link:hover { color: var(--white); }

        /* SUBMENIU DESKTOP */
        .nav-item-container { position: relative; }
        .submenu { 
            display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.95); border: 1px solid var(--gold); min-width: 250px; 
            padding: 20px; flex-direction: column; gap: 15px; z-index: 2100;
        }
        .nav-item-container:hover .submenu { display: flex; }

        /* SELECTOR LIMBA */
        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .lang-list { position: absolute; top: 100%; right: 0; width: 100%; background: #000; border: 1px solid var(--gold); display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }

        .menu-toggle { display: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; z-index: 2200; }

        .main-container { padding: 160px 5% 100px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 8vw, 6rem); font-style: italic; text-align: center; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 2000; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }

        /* MOBIL REPARAT */
        @media (max-width: 1024px) {
            header { height: 80px; flex-direction: row; }
            .menu-toggle { display: block; }
            .desktop-nav { 
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
                background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
                flex-direction: column; justify-content: center;
                opacity: 0; visibility: hidden; transition: 0.5s ease; z-index: 2100; gap: 2rem;
                overflow-y: auto; padding: 100px 0;
            }
            .desktop-nav.active { opacity: 1; visibility: visible; }
            .nav-link, .submenu-link { font-size: 1.2rem; }
            
            /* REPARARE SUPRAPUNERE SUBMENIU */
            .submenu { 
                position: relative; left: 0; transform: none; background: transparent; 
                border: none; width: 100%; display: none; padding: 10px 0; gap: 1rem;
            }
            .nav-item-container.active-mobile .submenu { display: flex; }
            .nav-item-container.active-mobile .nav-link i { transform: rotate(180deg); }
            
            .main-container { padding-top: 120px; }
            footer { position: relative; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>

    <div class="fixed-bg"></div>

    <header>
        <div class="header-top">
            <div class="menu-toggle" id="menuBtn"><i class="fas fa-bars"></i></div>
            <a href="index.html" class="logo-header">The Power Boutique</a>
            <div class="lang-dropdown">
                <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                    <img src="https://flagcdn.com/w20/ro.png" id="active-flag"> <span id="active-lang">RO</span> 
                    <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 5px;"></i>
                </button>
                <div class="lang-list" id="lang-list">
                    <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')" style="padding:15px; color:white;">RO</button>
                    <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')" style="padding:15px; color:white;">RU</button>
                </div>
            </div>
        </div>

        <nav class="desktop-nav" id="sidebar">
            <a href="index.html" class="nav-link">Acasă</a>
            <a href="programari.html" class="nav-link">Consultații</a>
            <div class="nav-item-container" id="shopContainer">
                <a href="javascript:void(0)" class="nav-link">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
                <div class="submenu">
                    <a href="shop-ea.html" class="submenu-link">Brățări Pentru Ea</a>
                    <a href="shop-el.html" class="submenu-link">Brățări Pentru El</a>
                </div>
            </div>
            <a href="despre.html" class="nav-link">Despre</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
    </header>

    <main class="main-container">
        <h1 class="hero-title">The Power Boutique</h1>
        <p style="letter-spacing:12px; text-transform:uppercase; font-size:0.75rem; text-align:center; opacity:0.8; margin-top:10px;">BY JELENA SHIPKO</p>
    </main>

    <script>
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        const shopContainer = document.getElementById('shopContainer');
        const dot = document.getElementById('dot');

        menuBtn.onclick = () => {
            sidebar.classList.toggle('active');
            menuBtn.innerHTML = sidebar.classList.contains('active') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        };

        shopContainer.onclick = (e) => { 
            if(window.innerWidth <= 1024) {
                e.stopPropagation();
                shopContainer.classList.toggle('active-mobile');
            }
        };

        // CURSOR FLUID (HARDWARE ACCELERATED)
        let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;

        function updatePos(e) {
            if (e.type === 'touchmove' || e.type === 'touchstart') {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            } else {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        }

        window.addEventListener('mousemove', updatePos);
        window.addEventListener('touchmove', updatePos, { passive: true });
        window.addEventListener('touchstart', updatePos, { passive: true });

        function animate() {
            currentX += (mouseX - currentX) * 0.15;
            currentY += (mouseY - currentY) * 0.15;
            dot.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) translate3d(-50%, -50%, 0)`;
            requestAnimationFrame(animate);
        }
        animate();

        function changeLang(code, label, flag) {
            document.getElementById('active-flag').src = flag;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
        }
    </script>
</body>
</html>
