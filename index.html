    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --burgundy: #800020;
            --midnight: #0a0e14;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            min-height: 100vh; 
            font-family: 'Montserrat', sans-serif; 
            color: var(--white); 
            background: #000; 
            overflow-x: hidden; 
        }

        /* FUNDAL CINEMATIC */
        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('cristale.jpg') no-repeat center center;
            background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* HEADER BARA SUBTILA */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass);
            height: 60px;
        }

        /* SIDEBAR (MENIU STÂNGA) */
        .sidebar {
            position: fixed;
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding-left: 10px;
        }

        .nav-item { list-style: none; }

        .nav-link {
            text-decoration: none;
            color: var(--gold);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: var(--transition);
            display: block;
            opacity: 0.8;
        }

        .nav-link:hover {
            color: var(--white);
            opacity: 1;
            transform: translateX(10px);
        }

        /* HERO - INTEGRARE POZĂ */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
            z-index: 1;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif; 
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: var(--gold); 
            margin-bottom: 15px; 
            letter-spacing: 2px;
        }

        .hero p {
            color: var(--burgundy);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* CONTAINER PENTRU IMAGINEA GENERATĂ */
        .featured-image {
            max-width: 800px;
            width: 100%;
            margin-bottom: 30px;
            border: 1px solid var(--glass);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            background: var(--midnight);
        }

        .featured-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-main {
            padding: 18px 50px; 
            border: 1px solid var(--gold); 
            color: var(--gold);
            text-decoration: none; 
            text-transform: uppercase; 
            font-size: 0.7rem;
            letter-spacing: 4px; 
            transition: 0.4s;
        }

        .btn-main:hover {
            background: var(--gold); 
            color: #000; 
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.3);
        }

        /* FOOTER */
        footer {
            padding: 40px 20px; 
            text-align: center; 
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid var(--glass); 
            position: relative; 
            z-index: 1;
        }

        .social-links { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; }
        .social-links a { color: var(--gold); font-size: 1.3rem; transition: 0.3s; }
        .social-links a:hover { transform: translateY(-3px); color: white; }
        .copyright { font-size: 0.6rem; color: var(--gold); opacity: 0.7; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .sidebar { 
                position: relative; 
                top: 0; 
                left: 0; 
                transform: none; 
                flex-direction: row; 
                flex-wrap: wrap;
                justify-content: center;
                padding: 80px 10px 0;
            }
            .hero { padding-top: 20px; }
        }
    </style>
</head>

        </div>
        <p class="copyright">© 2026 ENERGETICA • ELENA SHIPKO</p>
    </footer>

</body>
</html>
