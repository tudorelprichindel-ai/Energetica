<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --hermes-terracotta: #d35400; 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* CURSOR LOGIC IDENTIC */
        .cursor-dot { width: 25px; height: 25px; background-image: url('diamond-graphic-clipart-design-free-png.webp'); background-size: contain; background-repeat: no-repeat; background-position: center; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
        .cursor-dot.glow { width: 38px; height: 38px; filter: brightness(1.2); }
        .cursor-trail { position: fixed; pointer-events: none; z-index: 9998; width: 15px; height: 15px; border-radius: 50%; opacity: 0; transform: translate(-50%, -50%); filter: blur(4px); transition: opacity 1s ease-out; animation: smokeRise 4s infinite ease-out; }
        @keyframes smokeRise { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 100% { transform: translate(-50%, -120%) scale(2); opacity: 0; } }

        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out; }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* HEADER MODIFICAT PENTRU ICONITA MENIU */
        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; 
        }

        /* ICONITA HAMBURGER - VIZIBILA DOAR PE MOBIL */
        .menu-toggle {
            display: none;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 2101;
            transition: var(--transition);
        }

        .logo-header { 
            font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; 
        }

        /* SELECTOR LIMBA */
        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid var(--gold); border-top: none; display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; }

        /* SIDEBAR DESKTOP */
        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; display: flex; align-items: center; }

        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        
        @media (min-width: 1025px) {
            .nav-item-container:hover .submenu { display: flex; }
            .nav-link:hover { color: var(--white); }
        }

        .submenu-link { text-decoration: none; color: var(--white); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: var(--transition); }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }

        .main-container { padding: 120px 5% 100px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 8vw, 6rem); font-style: italic; text-align: center; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        
        .about-hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; width: 100%; max-width: 1200px; gap: 60px; margin-top: 40px; }
        .about-image-wrapper img { width: 100%; height: auto; -webkit-mask-image: radial-gradient(circle at 50% 40%, black 75%, transparent 100%); }
        .about-text-card { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); padding: 50px; border-left: 2px solid var(--burgundy); }
        
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 2000; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; font-size: 1.2rem; }
        .social-links a { color: var(--gold); }

        /* MOBIL - TRANSFORMARE SIDEBAR IN OVERLAY MENU */
        @media (max-width: 1024px) {
            .menu-toggle { display: block; } /* Aratam hamburgerul */
            
            .sidebar { 
                position: fixed; top: 0; left: -100%; width: 100%; height: 100vh; 
                background: rgba(0,0,0,0.98); backdrop-filter: blur(15px);
                flex-direction: column; justify-content: center; align-items: center;
                transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); transform: none;
                z-index: 2100; gap: 2rem;
            }

            .sidebar.active { left: 0; } /* Glisare meniu */

            .nav-link { font-size: 1.2rem; letter-spacing: 6px; }
            .submenu { padding: 1.5rem 0 0 0; align-items: center; }
            .submenu-link { font-size: 0.9rem; padding: 10px 0; }

            .nav-item-container.active-mobile .submenu { display: flex; }

            .about-hero { grid-template-columns: 1fr; text-align: center; }
            .main-container { padding-top: 140px; }
            footer { position: relative; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail" id="trail1" style="background:var(--gold)"></div>
    <div class="cursor-trail" id="trail2" style="background:var(--burgundy)"></div>
    <div class="cursor-trail" id="trail3" style="background:var(--hermes-terracotta)"></div>

    <div class="fixed-bg"></div>

    <header>
        <div class="menu-toggle" id="menuBtn">
            <i class="fas fa-bars"></i>
        </div>
        
        <a href="index.html" class="logo-header">The Power Boutique</a>
        
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" id="active-flag"> <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')">RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')">RU</button>
                <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')">LV</button>
                <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')">EN</button>
            </div>
        </div>
    </header>

    <nav class="sidebar" id="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        
        <div class="nav-item-container" id="shopContainer">
            <a href="javascript:void(0)" class="nav-link" id="nav-shop">
                Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i>
            </a>
            <div class="submenu">
                <a href="shop-ea.html" class="submenu-link" id="nav-bracelets">Brățări Energetice</a>
                <a href="digital-shop.html" class="submenu-link" id="nav-digital">Digital Shop</a>
            </div>
        </div>

        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main class="main-container">
        <h1 class="hero-title">The Power Boutique</h1>
        <p style="letter-spacing:12px; text-transform:uppercase; font-size:0.75rem; text-align:center; opacity:0.8; margin-top:10px;">BY JELENA SHIPKO</p>

        <section class="about-hero">
            <div class="about-image-wrapper"><img src="6.jpg" alt="Jelena Shipko"></div>
            <div class="about-text-card">
                <h2 id="about-title">Inima Din Spatele Puterii</h2>
                <p id="about-desc">Fiecare pas este o oportunitate de a ne alinia cu frecvența succesului.</p>
                <a href="despre.html" class="aura-btn" id="about-btn">Află Povestea</a>
                <div class="signature">Jelena Shipko</div>
            </div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p style="font-size:0.65rem; letter-spacing:4px; text-transform:uppercase; opacity:0.7;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        const shopContainer = document.getElementById('shopContainer');

        // Toggle Meniu Mobil
        menuBtn.onclick = () => {
            sidebar.classList.toggle('active');
            menuBtn.innerHTML = sidebar.classList.contains('active') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
        };

        // Toggle Submeniu pe Mobil
        shopContainer.onclick = (e) => {
            if(window.innerWidth <= 1024) {
                shopContainer.classList.toggle('active-mobile');
            }
        };

        // Cursor Logic
        const dot = document.getElementById('dot');
        window.addEventListener('mousemove', (e) => {
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
        });

        // Schimbare limba (Logica completa)
        function changeLang(code, label, flag) {
            document.getElementById('active-flag').src = flag;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            // Aici se pot adauga traducerile pentru restul textelor
        }
    </script>
</body>
</html>
