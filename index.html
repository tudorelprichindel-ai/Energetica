<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; width: 100%; }
        body { display: flex; flex-direction: column; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('cristale3.jpg') no-repeat center center; background-size: cover; }

        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        
        .lang-selector { display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--white); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; opacity: 0.5; transition: var(--transition); cursor: pointer; }
        .lang-btn:hover, .lang-btn.active { opacity: 1; color: var(--gold); }

        .shimmer-element, .social-links a i { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }

        .sidebar { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 100px 5%; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 10vw, 7rem); font-style: italic; line-height: 1.1; margin-bottom: 10px; }
        .hero-sub { letter-spacing: 10px; text-transform: uppercase; font-size: 0.9rem; opacity: 0.8; }

        footer { height: 80px; border-top: 1px solid var(--wine); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); }
        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { text-decoration: none; font-size: 1.4rem; }
        .copyright { font-size: 0.6rem; color: var(--white); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

        @media (max-width: 850px) {
            header { height: 70px !important; flex-direction: column; justify-content: center; gap: 5px; padding: 10px; }
            .sidebar { position: fixed; top: 70px; left: 0; transform: none; flex-direction: row; justify-content: center; padding: 15px; gap: 1rem; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); width: 100%; z-index: 1900; border-bottom: 1px solid var(--glass); }
            main { padding-top: 160px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-selector">
            <button onclick="changeLang('ru')" class="lang-btn" id="btn-ru">RU</button>
            <button onclick="changeLang('lv')" class="lang-btn" id="btn-lv">LV</button>
            <button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
            <button onclick="changeLang('ro')" class="lang-btn active" id="btn-ro">RO</button>
        </div>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <a href="products.html" class="nav-link" id="nav-shop">Shop</a>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main>
        <h1 class="hero-title shimmer-element">The Power Boutique</h1>
        <p class="hero-sub" id="hero-sub">BY JELENA SHIPKO</p>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const translations = {
            ro: { home: "Acasă", consult: "Consultații", shop: "Shop", about: "Despre", contact: "Contact", sub: "BY JELENA SHIPKO" },
            ru: { home: "Главная", consult: "Консультации", shop: "Магазин", about: "Обо мне", contact: "Контакт", sub: "ЕЛЕНА ШИПКО" },
            en: { home: "Home", consult: "Consultations", shop: "Shop", about: "About", contact: "Contact", sub: "BY JELENA SHIPKO" },
            lv: { home: "Sākums", consult: "Konsultācijas", shop: "Veikals", about: "Par mani", contact: "Kontakti", sub: "JELENA SHIPKO" }
        };

        function changeLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('nav-home').innerText = translations[lang].home;
            document.getElementById('nav-consult').innerText = translations[lang].consult;
            document.getElementById('nav-shop').innerText = translations[lang].shop;
            document.getElementById('nav-about').innerText = translations[lang].about;
            document.getElementById('nav-contact').innerText = translations[lang].contact;
            document.getElementById('hero-sub').innerText = translations[lang].sub;
        }
    </script>
</body>
</html>
