    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --burgundy: #800020;
            --midnight: #0a0e14;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* FUNDAL ACTUALIZAT CU cristale2.jpg */
        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('cristale2.jpg') no-repeat center center;
            background-size: cover;
        }

        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass);
            height: 60px;
        }

        .sidebar {
            position: fixed; top: 50%; left: 2rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 3px; transition: var(--transition);
            opacity: 0.6; display: block;
        }
        .nav-link:hover { opacity: 1; transform: translateX(8px); color: var(--white); }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 120px 20px 80px; position: relative;
        }

        .featured-image {
            max-width: 1050px; width: 100%; border: 1px solid var(--glass);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); border-radius: 2px;
            overflow: hidden; background: var(--midnight); 
            margin-bottom: 50px; opacity: 0.8; transition: var(--transition);
        }
        .featured-image:hover { opacity: 1; }
        .featured-image img { width: 100%; height: auto; display: block; }

        .name-top {
            color: var(--burgundy); letter-spacing: 8px; text-transform: uppercase;
            font-size: 0.85rem; font-weight: 600; margin-bottom: 15px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem);
            color: var(--gold); margin-bottom: 15px; letter-spacing: 1px; font-weight: 400;
        }

        .roles-bottom {
            color: var(--burgundy); letter-spacing: 4px; text-transform: uppercase;
            font-size: 0.7rem; font-weight: 600; margin-bottom: 50px;
        }
        .roles-bottom i { font-family: 'Playfair Display', serif; font-style: italic; text-transform: lowercase; opacity: 0.8; }

        .mini-services {
            max-width: 600px; width: 100%; margin-bottom: 60px;
            border-top: 1px solid var(--glass);
        }
        .service-item {
            padding: 18px 0; border-bottom: 1px solid var(--glass);
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.4s; cursor: pointer; text-decoration: none; color: inherit;
        }
        .service-item:hover { padding-left: 10px; color: var(--gold); }
        .service-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; }
        .service-arrow { font-size: 0.8rem; opacity: 0.5; color: var(--gold); }

        .btn-main {
            padding: 20px 60px; border: 1px solid var(--gold); color: var(--gold);
            text-decoration: none; text-transform: uppercase; font-size: 0.75rem;
            letter-spacing: 5px; transition: 0.5s;
        }
        .btn-main:hover { background: var(--gold); color: #000; box-shadow: 0 0 40px rgba(197, 160, 89, 0.2); }

        footer {
            padding: 60px 20px; text-align: center; background: rgba(0, 0, 0, 0.95);
            border-top: 1px solid var(--glass);
        }
        .social-links { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; }
        .social-links a { color: var(--gold); font-size: 1.2rem; transition: 0.3s; opacity: 0.7; }
        .social-links a:hover { opacity: 1; transform: translateY(-3px); color: white; }
        .copyright { font-size: 0.6rem; color: var(--gold); opacity: 0.5; letter-spacing: 2px; }

        @media (max-width: 768px) {
            .sidebar { position: relative; transform: none; left: 0; flex-direction: row; justify-content: center; padding: 100px 0 0; gap: 1rem; }
            .hero { padding-top: 40px; }
        }
    </style>
</head>
