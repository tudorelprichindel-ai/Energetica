<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energetica | Jelena Shipko</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.1);
            --transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            /* Outer Glow întunecat pentru contrast maxim */
            --dark-glow: 0 0 20px rgba(0, 0, 0, 0.9), 2px 2px 10px rgba(0, 0, 0, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('cristale2.jpg') no-repeat center center;
            background-size: cover;
            animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass);
            height: 70px;
        }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700; display: block;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .hero {
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 120px 20px; position: relative;
        }

        .name-top {
            color: var(--wine);
            letter-spacing: 10px; text-transform: uppercase;
            font-size: 1rem; font-weight: 700; margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        /* TEXT PRINCIPAL DOAR CU OUTER GLOW ÎNTUNECAT */
        .hero h1 {
            font-family: 'Playfair Display', serif; 
            font-size: clamp(2.5rem, 9vw, 5rem);
            color: var(--gold);
            margin-bottom: 30px; 
            letter-spacing: 3px; 
            font-weight: 700;
            line-height: 1.1;
            max-width: 1100px;
            text-shadow: var(--dark-glow);
        }

        /* TEXT SECUNDAR CU OUTER GLOW ÎNTUNECAT */
        .roles-bottom {
            color: var(--gold); 
            letter-spacing: 6px; 
            text-transform: uppercase;
            font-size: 0.9rem; 
            font-weight: 700;
            margin-top: 10px;
            text-shadow: var(--dark-glow);
        }

        footer {
            position: fixed; bottom: 0; width: 100%;
            padding: 40px 20px; text-align: center; background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px); border-top: 1px solid var(--wine);
        }
        .social-links { margin-bottom: 15px; }
        .social-links a { color: var(--gold); margin: 0 20px; font-size: 1.6rem; transition: 0.4s; display: inline-block; }
        .social-links a:hover { color: var(--white); transform: translateY(-5px); }
        .copyright { font-size: 0.7rem; color: var(--white); font-weight: 700; letter-spacing: 3px; }

        @media (max-width: 768px) {
            .sidebar { position: relative; transform: none; left: 0; flex-direction: row; justify-content: center; padding: 140px 0 0; gap: 1.5rem; }
            .hero { min-height: auto; padding-top: 40px; }
            footer { position: relative; margin-top: 50px; }
            .roles-bottom { font-size: 0.7rem; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header></header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main>
        <section class="hero">
            <div class="name-top">Jelena Shipko</div>
            <h1>The Power Boutique</h1>
            <div class="roles-bottom">Life Realisation • Business • Astrology • Energy Bracelets</div>
        </section>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
