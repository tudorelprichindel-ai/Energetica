<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --hermes-terracotta: rgba(211, 84, 0, 0.4); 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* CURSOR DIAMANT */
        .cursor-dot {
            width: 10px; height: 10px; background: var(--gold);
            position: fixed; pointer-events: none; z-index: 9999; 
            transition: width 0.3s, height 0.3s, background 0.3s, box-shadow 0.3s;
        }

        /* FUM SUBTIL ȘI LUNG */
        .cursor-trail {
            position: fixed; pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%); opacity: 0;
            width: 60px; height: 60px;
            background: radial-gradient(circle, rgba(197, 160, 89, 0.15) 0%, rgba(197, 160, 89, 0.05) 40%, transparent 70%);
            filter: blur(10px);
            transition: opacity 1.5s ease-out;
            animation: smokeRise 5s infinite ease-out;
        }
        @keyframes smokeRise {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.3; }
            100% { transform: translate(-50%, -130%) scale(2.8) rotate(90deg); opacity: 0; }
        }

        .cursor-dot.glow { width: 14px; height: 14px; box-shadow: 0 0 15px 5px var(--gold); background: #fff; }

        @keyframes floatingMagic { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }

        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; 
            background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out; 
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        header { 
            position: fixed; top: 0; width: 100%; z-index: 2000; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; 
        }

        .logo-header { 
            font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; 
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmerEffect 5s linear infinite, floatingMagic 4s ease-in-out infinite;
            display: inline-block;
        }

        /* SELECTOR LIMBA RESTABILIT COMPLET */
        .lang-dropdown { position: relative; animation: floatingMagic 4.5s ease-in-out infinite; }
        .lang-current { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); 
            padding: 8px 12px; font-size: 0.75rem; font-weight: 700; 
            display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px;
            transition: var(--transition);
        }
        .lang-current:hover { color: #fff; box-shadow: 0 0 15px var(--gold); border-color: #fff; }

        .lang-list { 
            position: absolute; top: 100%; left: 0; width: 100%; background: #000; 
            border: 1px solid var(--gold); border-top: none; display: none; 
            flex-direction: column; z-index: 2100;
        }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .lang-item:hover { background: var(--burgundy); color: var(--gold); }
        .flag-img { width: 20px; height: auto; }

        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { 
            text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; 
            letter-spacing: 4px; transition: var(--transition); font-weight: 700; 
            display: inline-block; animation: floatingMagic 5s ease-in-out infinite;
        }

        .main-container { padding: 120px 5% 100px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        .hero-section { text-align: center; margin-bottom: 40px; }
        .hero-title { 
            font-family: 'Playfair Display', serif; font-size: clamp(3rem, 8vw, 6rem); font-style: italic; margin-bottom: 10px;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); 
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            animation: shimmerEffect 5s linear infinite;
        }

        .about-hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; width: 100%; max-width: 1200px; gap: 60px; }
        .about-image-wrapper img { width: 100%; max-width: 500px; height: auto; filter: contrast(1.05) brightness(1.1); -webkit-mask-image: radial-gradient(circle at 50% 40%, black 75%, transparent 100%); }
        .about-text-card { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px); padding: 50px; border-left: 2px solid var(--burgundy); }
        .about-text-card h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; font-style: italic; }

        .aura-btn { 
            display: inline-block; background: transparent; border: 1px solid var(--gold); color: var(--gold); 
            padding: 12px 35px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; font-size: 0.7rem; 
            text-decoration: none; position: relative; overflow: hidden; transition: var(--transition);
            animation: floatingMagic 4s ease-in-out infinite;
        }
        .aura-btn:hover { color: #fff; box-shadow: 0 0 25px rgba(197, 160, 89, 0.4); border-color: #fff; }

        footer { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; 
            padding: 0 5%; z-index: 2000; border-top: 1px solid var(--burgundy); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px);
        }

        @media (max-width: 1024px) {
            .about-hero { grid-template-columns: 1fr; text-align: center; }
            .sidebar { 
                position: fixed; top: 80px; left: 0; transform: none; flex-direction: row; 
                flex-wrap: wrap; justify-content: center; width: 100%; padding: 15px 10px; 
                gap: 15px; background: var(--hermes-terracotta); backdrop-filter: blur(3px); z-index: 1999;
            }
            .nav-link { animation: none; font-size: 0.85rem; letter-spacing: 2px; text-shadow: 1px 1px 0px var(--burgundy), -1px -1px 0px var(--burgundy), 1px -1px 0px var(--burgundy), -1px 1px 0px var(--burgundy); }
            .main-container { padding-top: 160px; padding-bottom: 120px; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail" id="trail1"></div>
    <div class="cursor-trail" id="trail2"></div>
    <div class="cursor-trail" id="trail3"></div>
    <div class="cursor-trail" id="trail4"></div>
    <div class="cursor-trail" id="trail5"></div>
    <div class="cursor-trail" id="trail6"></div>

    <div class="fixed-bg"></div>

    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" class="flag-img" id="active-flag" alt="RO">
                <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')"><img src="https://flagcdn.com/w20/ro.png" class="flag-img"> RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')"><img src="https://flagcdn.com/w20/ru.png" class="flag-img"> RU</button>
                <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')"><img src="https://flagcdn.com/w20/lv.png" class="flag-img"> LV</button>
                <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')"><img src="https://flagcdn.com/w20/gb.png" class="flag-img"> EN</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <nav class="sidebar">
            <a href="index.html" class="nav-link">Acasă</a>
            <a href="programari.html" class="nav-link">Consultații</a>
            <a href="products.html" class="nav-link">Shop</a>
            <a href="despre.html" class="nav-link">Despre</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>

        <section class="hero-section">
            <h1 class="hero-title">The Power Boutique</h1>
            <p style="letter-spacing: 12px; text-transform: uppercase; font-size: 0.75rem; opacity: 0.8; text-align: center;">BY JELENA SHIPKO</p>
        </section>

        <section class="about-hero">
            <div class="about-image-wrapper"><img src="6.jpg" alt="Jelena"></div>
            <div class="about-text-card">
                <h2>Inima Din Spatele Puterii</h2>
                <p>Fiecare pas este o oportunitate de a ne alinia cu frecvența succesului.</p>
                <a href="despre.html" class="aura-btn">Află Povestea</a>
            </div>
        </section>
    </main>

    <footer>
        <div style="display:flex; gap:30px; margin-bottom:5px; font-size:1.2rem;">
            <a href="#" style="color:var(--gold); animation:floatingMagic 3.5s ease-in-out infinite;"><i class="fab fa-instagram"></i></a>
            <a href="#" style="color:var(--gold); animation:floatingMagic 3.8s ease-in-out infinite;"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank" style="color:var(--gold); animation:floatingMagic 3.2s ease-in-out infinite;"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank" style="color:var(--gold); animation:floatingMagic 3.5s ease-in-out infinite;"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p style="font-size:0.65rem; letter-spacing:4px; text-transform:uppercase; opacity:0.7;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const dot = document.getElementById('dot');
        const trails = [
            { el: document.getElementById('trail1'), x: 0, y: 0, lag: 0.05 },
            { el: document.getElementById('trail2'), x: 0, y: 0, lag: 0.1 },
            { el: document.getElementById('trail3'), x: 0, y: 0, lag: 0.15 },
            { el: document.getElementById('trail4'), x: 0, y: 0, lag: 0.2 },
            { el: document.getElementById('trail5'), x: 0, y: 0, lag: 0.25 },
            { el: document.getElementById('trail6'), x: 0, y: 0, lag: 0.3 }
        ];

        let mouseX = 0, mouseY = 0;

        function updateCoords(e) {
            if (e.touches && e.touches.length > 0) {
                mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY;
            } else {
                mouseX = e.clientX; mouseY = e.clientY;
            }
            dot.style.transform = `translate(-50%, -50%) rotate(45deg)`;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
            trails.forEach(t => t.el.style.opacity = "1");
        }

        window.addEventListener('mousemove', updateCoords);
        window.addEventListener('touchmove', updateCoords, { passive: true });
        window.addEventListener('touchstart', updateCoords, { passive: true });

        function animateTrails() {
            trails.forEach(trail => {
                trail.x += (mouseX - trail.x) * trail.lag;
                trail.y += (mouseY - trail.y) * trail.lag;
                trail.el.style.left = trail.x + 'px'; trail.el.style.top = trail.y + 'px';
            });
            requestAnimationFrame(animateTrails);
        }
        animateTrails();

        function changeLang(langCode, label, flagSrc) {
            document.getElementById('active-flag').src = flagSrc;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.lang-dropdown')) {
                const list = document.getElementById('lang-list');
                if (list) list.classList.remove('show');
            }
        }
    </script>
</body>
</html>
