<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Cat Engine - Strict Masking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        
        body { 
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #020617 100%); 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh; 
            overflow: hidden;
            perspective: 1000px;
        }
        
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; width: 100%; max-width: 500px; margin: 0 auto; transition: all 0.3s ease; }
        
        #grid.active-game .cell {
            cursor: url('assets/ciocan_cursor.png') 2 2, crosshair; 
        }

        .cell { 
            aspect-ratio: 1; 
            background: #0b1121; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            cursor: not-allowed; 
            transition: all 0.1s; 
            border: 3px solid #1e293b; 
            box-shadow: inset 0 15px 25px rgba(0,0,0,0.9), 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden; /* MASCA ACTIVATĂ: Taie orice depășește conturul rotund */
        }

        .cell::before {
            content: '';
            width: 55%;
            height: 55%;
            background: radial-gradient(circle, #334155 0%, #1e293b 100%);
            border-radius: 50%;
            position: absolute;
            bottom: -60%;
            transition: bottom 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .cell.peeking { 
            border-color: #3b82f6; 
            box-shadow: inset 0 15px 25px rgba(0,0,0,0.9), 0 0 15px rgba(59, 130, 246, 0.5); 
        }
        .cell.peeking::before { bottom: 10%; }

        .content { 
            width: 95%; 
            height: 95%; 
            display: flex; align-items: center; justify-content: center; 
            z-index: 10; 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0; 
            transition: opacity 0.1s;
        }

        @keyframes popUpPisicaMare {
            0% { transform: scale(0.5) translateY(15px); opacity: 0; }
            60% { transform: scale(1.3) translateY(-3px); opacity: 1; } 
            100% { transform: scale(1.1) translateY(0); opacity: 1; } 
        }

        .cell.diamond { 
            background: radial-gradient(circle at center, #10b981 0%, #064e3b 100%); 
            border-color: #34d399; 
            cursor: default; 
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); 
            /* S-a eliminat overflow: visible pentru a menține masca rotundă */
        }

        .cell.diamond .content { 
            opacity: 1;
            animation: popUpPisicaMare 0.4s forwards; 
            background-image: url('assets/pisica.png'); 
        }
        .cell.diamond::before { display: none; }

        @keyframes explodeOutBomba {
            0% { transform: scale(0.5); opacity: 0;}
            50% { transform: scale(1.4); background: #ef4444; opacity: 1;}
            100% { transform: scale(1.0); opacity: 1;}
        }
        
        .cell.mine { 
            background: radial-gradient(circle at center, #ef4444 0%, #7f1d1d 100%); 
            border-color: #fca5a5; 
            cursor: default; 
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6); 
            /* S-a eliminat overflow: visible */
        }
        
        .cell.mine .content { 
            opacity: 1;
            animation: explodeOutBomba 0.5s forwards; 
            background-image: url('assets/bomba.png'); 
        }
        .cell.mine::before { display: none; }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) translateY(-8px) rotate(-2deg); }
            20%, 40%, 60%, 80% { transform: translateX(8px) translateY(8px) rotate(2deg); }
        }
        .shake-active { animation: shake 0.6s ease-in-out; }

        .grid-container.game-over .cell:not(.diamond):not(.mine) { opacity: 0.3; filter: grayscale(100%); pointer-events: none; }

        .btn-glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
        .btn-glow:hover { box-shadow: 0 0 30px rgba(59, 130, 246, 0.6); }
        .btn-cashout-glow { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
        .btn-cashout-glow:hover { box-shadow: 0 0 30px rgba(16, 185, 129, 0.6); }

        input:disabled, select:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div id="mainWrapper" class="w-full max-w-5xl flex flex-col gap-4 transition-transform duration-100">
        
        <div class="glass px-8 py-5 rounded-3xl flex justify-between items-center z-10">
            <h1 class="text-3xl font-black italic text-white cyber-font tracking-wider">WHACK-A-<span class="text-blue-500">CAT</span></h1>
            <div class="bg-slate-900/90 px-6 py-3 rounded-xl border border-slate-700 shadow-inner">
                <span class="text-2xl font-black text-blue-400 cyber-font" id="walletBalance">$1000.00</span>
            </div>
        </div>

        <div class="glass p-8 rounded-[2.5rem] flex flex-col md:flex-row gap-10 relative z-10">
            <div class="w-full md:w-[40%] flex flex-col gap-6">
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-white/5 transition-all hover:border-white/10">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Bet Amount</label>
                    <input type="number" id="betInput" value="10.00" class="w-full bg-[#0b1121] text-white font-black text-2xl p-4 rounded-xl border border-slate-800 outline-none focus:border-blue-500/50 transition-colors">
                </div>
                <div class="bg-slate-900/60 p-5 rounded-2xl border border-white/5 transition-all hover:border-white/10">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Inamici (Câini)</label>
                    <select id="mineSelect" class="w-full bg-[#0b1121] text-white font-black text-lg p-4 rounded-xl border border-slate-800 outline-none focus:border-blue-500/50 transition-colors">
                        <option value="1">1 Câine</option>
                        <option value="3" selected>3 Câini</option>
                        <option value="5">5 Câini</option>
                        <option value="10">10 Câini</option>
                    </select>
                </div>
                <div class="p-6 rounded-2xl bg-gradient-to-br from-slate-900 to-[#0b1121] border border-slate-800 text-center relative overflow-hidden">
                    <div class="absolute inset-0 bg-blue-500/5 opacity-0 transition-opacity duration-300" id="profitGlow"></div>
                    <div class="text-5xl font-black text-white cyber-font relative z-10 transition-all duration-300" id="cashoutDisplay">0.00</div>
                    <div class="text-blue-400 text-lg font-bold mt-2 relative z-10 transition-all duration-300" id="multiplierDisplay">1.00x</div>
                </div>
                <button id="actionBtn" onclick="handleAction()" class="bg-gradient-to-r from-blue-600 to-blue-500 text-white btn-glow w-full py-6 rounded-2xl font-black text-2xl cyber-font transition-all transform hover:-translate-y-1 active:translate-y-1 tracking-wider">START WHACK</button>
            </div>

            <div class="w-full md:w-[60%] flex items-center justify-center bg-slate-900/40 rounded-[2rem] p-8 border border-white/5 shadow-inner">
                <div id="grid" class="grid-container"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:5000/api";
        let isGameActive = false;
        let isActionProcessing = false; 
        
        let peekInterval;

        const sfxHit = new Audio('assets/hit.mp3');
        const sfxWin = new Audio('assets/win.mp3');
        const sfxLose = new Audio('assets/lose.mp3');

        function playSound(audioEl) {
            if(!audioEl.src.includes('undefined')) {
                const clone = audioEl.cloneNode();
                clone.play().catch(e => console.log("Sunet ignorat:", e));
            }
        }

        function startPeeking() {
            clearInterval(peekInterval);
            
            peekInterval = setInterval(() => {
                if(!isGameActive) {
                    clearInterval(peekInterval);
                    return;
                }

                document.querySelectorAll('.peeking').forEach(el => el.classList.remove('peeking'));

                const emptyCells = Array.from(document.querySelectorAll('.cell:not(.diamond):not(.mine)'));
                if(emptyCells.length === 0) {
                    clearInterval(peekInterval);
                    return;
                }

                const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                randomCell.classList.add('peeking');

            }, 1200); 
        }

        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            grid.classList.remove('game-over');
            clearInterval(peekInterval);

            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.idx = i;
                
                const content = document.createElement('div');
                content.className = 'content';
                cell.appendChild(content);

                cell.onmousedown = () => {
                    if (isGameActive && cell.classList.contains('peeking')) {
                        playSound(sfxHit);
                    }
                };
                cell.onclick = () => revealCell(i, cell);
                grid.appendChild(cell);
            }
        }

        async function handleAction() {
            if (isActionProcessing) return; 
            isActionProcessing = true;
            
            const btn = document.getElementById('actionBtn');
            const mainWrapper = document.getElementById('mainWrapper');
            const betInput = document.getElementById('betInput');
            const mineSelect = document.getElementById('mineSelect');
            const gridEl = document.getElementById('grid'); 
            mainWrapper.classList.remove('shake-active');

            try {
                if (!isGameActive) {
                    const bet = betInput.value;
                    const mines = mineSelect.value;
                    const res = await fetch(`${API_URL}/start`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({bet, mines})
                    });
                    
                    if (!res.ok) throw new Error("Serverul Python nu a răspuns.");
                    
                    const data = await res.json();
                    
                    if(data.status === "started") {
                        isGameActive = true;
                        gridEl.classList.add('active-game');
                        betInput.disabled = true;
                        mineSelect.disabled = true;
                        document.getElementById('walletBalance').innerText = '$' + data.balance.toFixed(2);
                        btn.innerText = "CASHOUT";
                        btn.className = "bg-gradient-to-r from-emerald-500 to-emerald-400 text-slate-900 btn-cashout-glow w-full py-6 rounded-2xl font-black text-2xl cyber-font transition-all transform hover:-translate-y-1 active:translate-y-1 tracking-wider";
                        document.getElementById('cashoutDisplay').innerText = "0.00";
                        document.getElementById('multiplierDisplay').innerText = "1.00x";
                        document.getElementById('profitGlow').style.opacity = '0';
                        initGrid();
                        startPeeking(); 
                    }
                } else {
                    const res = await fetch(`${API_URL}/cashout`, {method: 'POST'});
                    const data = await res.json();
                    if(data.status === "success") {
                        isGameActive = false;
                        clearInterval(peekInterval);
                        playSound(sfxWin);
                        gridEl.classList.remove('active-game');
                        betInput.disabled = false;
                        mineSelect.disabled = false;
                        document.getElementById('walletBalance').innerText = '$' + data.new_balance.toFixed(2);
                        document.getElementById('grid').classList.add('game-over');
                        btn.innerText = "START WHACK";
                        btn.className = "bg-gradient-to-r from-blue-600 to-blue-500 text-white btn-glow w-full py-6 rounded-2xl font-black text-2xl cyber-font transition-all transform hover:-translate-y-1 active:translate-y-1 tracking-wider";
                    }
                }
            } catch (err) {
                console.error("Eroare de sistem:", err);
                alert("Eroare: Asigură-te că serverul Python rulează în fundal!");
            } finally {
                isActionProcessing = false;
            }
        }

        async function revealCell(idx, element) {
            if (!isGameActive || element.dataset.processing || !element.classList.contains('peeking')) return;

            element.dataset.processing = "true"; 
            
            setTimeout(() => {
                element.classList.remove('peeking'); 
            }, 100);

            try {
                const res = await fetch(`${API_URL}/reveal`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({index: idx})
                });
                
                if (!res.ok) throw new Error("A picat conexiunea.");
                const data = await res.json();

                if (data.error) {
                    delete element.dataset.processing; 
                    return;
                }

                const contentDiv = element.querySelector('.content');

                if (data.status === "diamond") {
                    element.classList.add('diamond');
                    playSound(sfxWin); 
                    
                    document.getElementById('cashoutDisplay').innerText = data.cashout.toFixed(2);
                    document.getElementById('multiplierDisplay').innerText = data.multiplier.toFixed(2) + "x";
                    
                    const profitGlow = document.getElementById('profitGlow');
                    profitGlow.style.opacity = '1';
                    setTimeout(() => profitGlow.style.opacity = '0.2', 300);

                } else if (data.status === "mine") {
                    element.classList.add('mine');
                    playSound(sfxLose); 
                    isGameActive = false;
                    clearInterval(peekInterval);
                    gridEl.classList.remove('active-game');
                    document.getElementById('betInput').disabled = false;
                    document.getElementById('mineSelect').disabled = false;
                    const mainWrapper = document.getElementById('mainWrapper');
                    mainWrapper.classList.remove('shake-active');
                    void mainWrapper.offsetWidth; 
                    mainWrapper.classList.add('shake-active');
                    document.getElementById('grid').classList.add('game-over');
                    const btn = document.getElementById('actionBtn');
                    btn.innerText = "START WHACK";
                    btn.className = "bg-gradient-to-r from-blue-600 to-blue-500 text-white btn-glow w-full py-6 rounded-2xl font-black text-2xl cyber-font transition-all transform hover:-translate-y-1 active:translate-y-1 tracking-wider";
                }
            } catch (err) {
                console.error("Eroare Click:", err);
            } finally {
                delete element.dataset.processing; 
            }
        }

        initGrid();
    </script>
</body>
</html>
