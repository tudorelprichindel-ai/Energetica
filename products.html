<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        
        body { 
            display: flex; flex-direction: column;
            background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
        }

        header, footer {
            width: 100%; height: 80px; 
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center; z-index: 2000;
        }

        header { position: fixed; top: 0; border-bottom: 1px solid var(--glass); }
        
        footer { 
            margin-top: auto; border-top: 1px solid var(--wine); 
            flex-direction: column; background: rgba(0, 0, 0, 0.4);
        }

        .shimmer-element {
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 4px; font-weight: 700; }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }

        main { flex: 1; padding: 140px 5% 60px; max-width: 1400px; margin: 0 auto; width: 100%; }

        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { text-decoration: none; font-size: 1.3rem; }
        .copyright { font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,255,255,0.4); text-transform: uppercase; }

        @media (max-width: 850px) {
            header, footer { height: 70px !important; }
            .sidebar {
                position: sticky; top: 70px; left: 0; transform: none;
                flex-direction: row; justify-content: center;
                margin-top: 70px; padding: 15px; gap: 1rem;
                background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
                width: 100%; z-index: 1900; border-bottom: 1px solid var(--glass);
            }
            main { padding: 40px 5%; }
            .nav-link { font-size: 0.6rem; letter-spacing: 2px; }
            footer { padding: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header><a href="index.html" class="logo-header shimmer-element">The Power Boutique</a></header>
    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>
    <main>
        <h1 class="shimmer-element" style="font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; text-align: center; color: var(--gold);">Shop</h1>
    </main>
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
