<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition-cinematic: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            --gold-glow: 0 0 50px rgba(197, 160, 89, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('cristale3.jpg') center center no-repeat;
            background-size: cover;
            animation: slowPan 30s infinite alternate ease-in-out;
        }

        @keyframes slowPan { from { transform: scale(1.1); } to { transform: scale(1.2); } }

        /* HEADER IDENTIC PE TOATE PAGINILE */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            height: 80px; display: flex; justify-content: center; align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            text-decoration: none; font-size: 1.4rem; letter-spacing: 4px; font-weight: 400;
            color: var(--gold); text-transform: uppercase;
        }

        /* SIDEBAR - Aliniat unitar */
        .sidebar {
            position: fixed; 
            top: 100px; 
            left: 2rem; 
            z-index: 1000;
            display: flex; 
            flex-direction: column; 
            gap: 2rem;
        }

        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: 0.5s ease;
            font-weight: 700; opacity: 0.7;
        }
        .nav-link:hover { opacity: 1; transform: translateX(10px); color: var(--white); }

        .shop-container {
            padding: 160px 2% 120px;
            max-width: 1550px;
            margin: 0 auto;
            text-align: center;
        }

        /* TITLURI CU CURSIVITATEA DIN LANDING PAGE */
        .section-subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.1rem; 
            letter-spacing: 4px; 
            color: var(--gold); 
            margin-bottom: 10px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-style: italic; 
            color: var(--white);
            margin-bottom: 80px; 
            font-weight: 400;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 70px;
            justify-content: center;
            padding: 0 40px;
        }

        .product-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px; 
            transition: var(--transition-cinematic);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
        }

        .product-card:hover {
            transform: translateY(-10px);
            border-color: rgba(197, 160, 89, 0.5);
            box-shadow: var(--gold-glow);
        }

        .product-media {
            width: 100%; 
            aspect-ratio: 1/1; 
            background: rgba(0, 0, 0, 0.3); 
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            margin-bottom: 25px;
        }

        .product-media video {
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            transition: var(--transition-cinematic);
        }

        .product-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem; color: var(--gold); margin-bottom: 12px;
            letter-spacing: 1px;
            font-style: italic;
        }

        .product-description {
            font-size: 0.8rem; color: rgba(255,255,255,0.6); 
            margin-bottom: 15px; min-height: 45px;
            font-weight: 300; font-style: italic;
        }

        .product-price {
            font-family: 'Montserrat', sans-serif;
            color: var(--white); font-weight: 600; font-size: 1.15rem;
            margin-bottom: 25px; letter-spacing: 1px;
        }

        .order-btn {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 30px; text-transform: uppercase;
            letter-spacing: 3px; font-weight: 700; font-size: 0.65rem;
            cursor: pointer; transition: 0.5s ease; text-decoration: none;
            display: inline-block;
        }

        .order-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 25px rgba(197, 160, 89, 0.4); }

        /* FOOTER UNITAR CU LINKURI SOCIALE */
        footer {
            position: relative; width: 100%; padding: 60px 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(197, 160, 89, 0.2);
        }
        .social-links { margin-bottom: 20px; }
        .social-links a { color: var(--gold); margin: 0 20px; font-size: 1.5rem; transition: 0.4s; }
        .social-links a:hover { color: var(--white);
