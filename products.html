<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
        }

        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 80px; display: flex; justify-content: center; align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif;
            text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700;
            color: var(--gold);
        }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }

        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700;
        }

        .shop-container {
            padding: 140px 10% 120px;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }

        .product-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            transition: var(--transition);
            text-align: left;
        }

        .product-media {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            margin-bottom: 15px;
            background: #111;
        }

        .product-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-card h3 { color: var(--gold); margin-bottom: 10px; font-family: 'Playfair Display', serif; }
        .product-description { font-size: 0.8rem; color: #ccc; margin-bottom: 20px; }

        .order-btn {
            display: inline-block;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 20px;
            text-decoration: none;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        footer {
            height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.8); border-top: 1px solid var(--wine);
        }
        .social-links a { color: var(--gold); margin: 0 15px; font-size: 1.2rem; }

        @media (max-width: 850px) {
            .sidebar { position: relative; transform: none; left: 0; flex-direction: row; justify-content: center; margin-top: 100px; }
            .shop-container { padding: 40px 5%; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header><a href="index.html" class="logo-header">The Power Boutique</a></header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main class="shop-container">
        <h1 style="font-family: 'Playfair Display', serif; color: var(--gold); margin-bottom: 40px;">Colecție Live</h1>
        <div id="product-container" class="product-grid">
            <p id="status">Se încarcă produsele...</p>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="https://t.me/energetiskas_rotas"><i class="fab fa-telegram-plane"></i></a>
        </div>
        <p style="font-size: 0.6rem; margin-top: 10px;">© 2026 ENERGETICA</p>
    </footer>

    <script>
        const BOT_TOKEN = '8399850143:AAEp0i6ge8mSutMfOtoEPzve1rmThUxV-wU';
        const CHANNEL_ID = '@energetiskas_rotas';
        const POST_IDS = [306]; // AICI adaugi manual ID-urile postărilor (ex: [306, 307, 308])

        async function fetchTelegramPost(postId) {
            try {
                // Notă: Telegram API nu permite preluarea directă a fișierelor media pe web fără un proxy.
                // Această metodă simulează extragerea pentru a menține designul.
                const container = document.getElementById('product-container');
                const loadingStatus = document.getElementById('status');
                if(loadingStatus) loadingStatus.remove();

                const card = document.createElement('div');
                card.className = 'product-card';
                
                // Construim structura produsului
                card.innerHTML = `
                    <div class="product-media">
                        <video src="https://t.me/${CHANNEL_ID.replace('@','')}/${postId}?embed=1&mode=video" autoplay muted loop playsinline></video>
                    </div>
                    <h3>Piesa #${postId}</h3>
                    <p class="product-description">Vizualizează detaliile acestei creații energetice direct pe site-ul nostru.</p>
                    <a href="contact.html" class="order-btn">Solicită Detalii</a>
                `;
                container.appendChild(card);
            } catch (error) {
                console.error("Eroare la încărcare:", error);
            }
        }

        // Încărcăm toate ID-urile listate
        POST_IDS.forEach(id => fetchTelegramPost(id));
    </script>
</body>
</html>
