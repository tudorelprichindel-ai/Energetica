<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --dark-glow: 0 0 25px rgba(0, 0, 0, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* FUNDAL IDENTIC */
        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
            animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* HEADER IDENTIC */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 80px;
            display: flex; justify-content: center; align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif;
            text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }

        @keyframes shimmerEffect { to { background-position: 200% center; } }

        /* SIDEBAR DESKTOP */
        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        /* SHOP CONTENT */
        .shop-container {
            padding: 140px 10% 120px;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--gold);
            margin-bottom: 15px;
            text-shadow: var(--dark-glow);
        }

        .section-subtitle {
            letter-spacing: 5px;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: var(--wine);
            font-weight: 700;
            margin-bottom: 50px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 40px;
        }

        .product-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 30px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-card:hover {
            transform: translateY(-10px);
            background: rgba(255,255,255,0.08);
            border-color: var(--gold);
        }

        .product-img-placeholder {
            width: 100%;
            aspect-ratio: 1/1;
            background: rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .product-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .product-price {
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .buy-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 12px 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .buy-btn:hover {
            background: var(--gold);
            color: #000;
        }

        /* FOOTER IDENTIC */
        footer {
            position: relative; width: 100%; height: 80px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-top: 1px solid var(--wine);
            z-index: 1000;
        }
        .social-links a { color: var(--gold); margin: 0 15px; font-size: 1.4rem; transition: var(--transition); }
        .copyright { font-size: 0.6rem; color: var(--white); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* RESPONSIVE PENTRU MOBIL */
        @media (max-width: 850px) {
            header { height: 70px; }
            .sidebar {
                position: relative; transform: none; left: 0;
                flex-direction: row; flex-wrap: wrap; justify-content: center;
                margin-top: 70px; padding: 20px 10px; gap: 1rem;
            }
            .shop-container { padding: 40px 5% 80px; }
            .section-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    
    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main class="shop-container">
        <div class="section-subtitle">Energy Bracelets</div>
        <h1 class="section-title">Colecția Energetică</h1>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img-placeholder">
                    <i class="fas fa-gem fa-3x" style="color: var(--gold); opacity: 0.5;"></i>
                </div>
                <h3>Brățară Protecție</h3>
                <p class="product-price">250 RON</p>
                <a href="#" class="buy-btn">Detalii produs</a>
            </div>

            <div class="product-card">
                <div class="product-img-placeholder">
                    <i class="fas fa-sun fa-3x" style="color: var(--gold); opacity: 0.5;"></i>
                </div>
                <h3>Brățară Abundență</h3>
                <p class="product-price">280 RON</p>
                <a href="#" class="buy-btn">Detalii produs</a>
            </div>

            <div class="product-card">
                <div class="product-img-placeholder">
                    <i class="fas fa-moon fa-3x" style="color: var(--gold); opacity: 0.5;"></i>
                </div>
                <h3>Brățară Intuiție</h3>
                <p class="product-price">250 RON</p>
                <a href="#" class="buy-btn">Detalii produs</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
