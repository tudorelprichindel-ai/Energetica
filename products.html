<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Categorii Brățări | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --glass: rgba(255, 255, 255, 0.05); 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* RESET & CURSOR */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
        body { background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; line-height: 1.6; }

        .cursor-dot { width: 25px; height: 25px; background-image: url('diamond-graphic-clipart-design-free-png.webp'); background-size: contain; background-repeat: no-repeat; background-position: center; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); }
        .cursor-trail { position: fixed; pointer-events: none; z-index: 9998; width: 12px; height: 12px; border-radius: 50%; opacity: 0; transform: translate(-50%, -50%); filter: blur(4px); animation: smokeRise 4s infinite ease-out; background: var(--gold); }
        @keyframes smokeRise { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } 100% { transform: translate(-50%, -150%) scale(2); opacity: 0; } }

        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('cristale3.jpg') no-repeat center center; background-size: cover; }

        /* HEADER & LANG (IDENTIC CU INDEX) */
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; color: var(--gold); }
        
        .lang-dropdown { position: relative; }
        .lang-current { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); 
            padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px;
        }
        .lang-list { 
            position: absolute; top: 100%; left: 0; width: 100%; background: #000; 
            border: 1px solid var(--gold); border-top: none; display: none; 
            flex-direction: column; z-index: 2100;
        }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        /* SIDEBAR & SUBMENU (IDENTIC CU INDEX) */
        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; }
        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        .nav-item-container:hover .submenu { display: flex; }
        .submenu-link { text-decoration: none; color: #fff; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: 0.3s; }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }

        /* CATEGORIES HUB */
        main { padding: 160px 5% 100px; width: 100%; max-width: 1400px; margin: 0 auto; text-align: center; }
        .hub-title { font-family: 'Playfair Display', serif; font-size: 3rem; font-style: italic; color: var(--gold); margin-bottom: 60px; }
        
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; justify-content: center; }
        
        .category-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--glass); 
            padding: 50px 30px; 
            transition: var(--transition); 
            text-decoration: none; 
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        
        .category-card:hover { border-color: var(--gold); transform: translateY(-10px); background: rgba(197, 160, 89, 0.05); }
        .category-card i { font-size: 2.5rem; color: var(--gold); }
        .category-card h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic; letter-spacing: 2px; }
        .category-card span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.6; }

        footer { position: relative; height: 80px; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); width: 100%; }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; }
        .social-links a { color: var(--gold); font-size: 1.2rem; }
        .footer-copy { font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7; }

        @media (max-width: 1024px) {
            .sidebar { position: fixed; top: 80px; left: 0; transform: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; gap: 20px; background: rgba(0,0,0,0.95); z-index: 1999; height: auto; }
            .nav-item-container.active .submenu { display: flex; width: 100%; align-items: center; padding-left: 0; }
            main { padding-top: 180px; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail" id="trail"></div>
    <div class="fixed-bg"></div>

    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" class="flag-img" id="active-flag" alt="RO">
                <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')"><img src="https://flagcdn.com/w20/ro.png" class="flag-img"> RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')"><img src="https://flagcdn.com/w20/ru.png" class="flag-img"> RU</button>
                <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')"><img src="https://flagcdn.com/w20/lv.png" class="flag-img"> LV</button>
                <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')"><img src="https://flagcdn.com/w20/gb.png" class="flag-img"> EN</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <div class="nav-item-container">
            <a href="javascript:void(0)" class="nav-link" id="nav-shop">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
            <div class="submenu">
                <a href="products.html" class="submenu-link" id="nav-bracelets">Brățări Energetice</a>
                <a href="digital-shop.html" class="submenu-link" id="nav-digital">Digital Shop</a>
            </div>
        </div>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main>
        <h1 class="hub-title" id="page-title">Alege Categoria</h1>
        <div class="categories-grid">
            <a href="shop-ea.html" class="category-card">
                <i class="fas fa-venus"></i>
                <h3 id="cat-her">Pentru Ea</h3>
                <span id="span-discover-1">Descoperă</span>
            </a>
            <a href="shop-el.html" class="category-card">
                <i class="fas fa-mars"></i>
                <h3 id="cat-him">Pentru El</h3>
                <span id="span-discover-2">Descoperă</span>
            </a>
            <a href="shop-cupluri.html" class="category-card">
                <i class="fas fa-infinity"></i>
                <h3 id="cat-couples">Pentru Cupluri</h3>
                <span id="span-discover-3">Descoperă</span>
            </a>
            <a href="shop-personalizate.html" class="category-card">
                <i class="fas fa-fingerprint"></i>
                <h3 id="cat-custom">Personalizate</h3>
                <span id="span-unique">Unice</span>
            </a>
            <a href="shop-morse.html" class="category-card">
                <i class="fas fa-ellipsis-h"></i>
                <h3 id="cat-morse">Brățări Morse</h3>
                <span id="span-sacred">Mesaje Sacre</span>
            </a>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="footer-copy">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const dot = document.getElementById('dot');
        const trail = document.getElementById('trail');
        let mouseX = 0, mouseY = 0, trailX = 0, trailY = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
            trail.style.opacity = "1";
        });

        function animateTrail() {
            trailX += (mouseX - trailX) * 0.1;
            trailY += (mouseY - trailY) * 0.1;
            trail.style.left = trailX + 'px'; trail.el.style.top = trailY + 'px';
            requestAnimationFrame(animateTrail);
        }
        animateTrail();

        const translations = {
            'ro': { home: "Acasă", consult: "Consultații", bracelets: "Brățări Energetice", digital: "Digital Shop", about: "Despre", contact: "Contact", title: "Alege Categoria", her: "Pentru Ea", him: "Pentru El", couples: "Pentru Cupluri", custom: "Personalizate", morse: "Brățări Morse", d1: "Descoperă", d2: "Descoperă", d3: "Descoperă", unique: "Unice", sacred: "Mesaje Sacre" },
            'ru': { home: "Главная", consult: "Консультации", bracelets: "Браслеты", digital: "Цифровой магазин", about: "Обо мне", contact: "Контакт", title: "Выберите категорию", her: "Для неё", him: "Для него", couples: "Для пар", custom: "Индивидуальные", morse: "Браслеты Морзе", d1: "Открыть", d2: "Открыть", d3: "Открыть", unique: "Уникальные", sacred: "Священные послания" },
            'lv': { home: "Sākums", consult: "Konsultācijas", bracelets: "Aproces", digital: "Digitālais veikals", about: "Par mani", contact: "Kontakti", title: "Izvēlieties kategoriju", her: "Viņai", him: "Viņam", couples: "Pāriem", custom: "Personalizētas", morse: "Morzes aproces", d1: "Atklāt", d2: "Atklāt", d3: "Atklāt", unique: "Unikālas", sacred: "Svētie vēstījumi" },
            'en': { home: "Home", consult: "Consultations", bracelets: "Bracelets", digital: "Digital Shop", about: "About", contact: "Contact", title: "Choose Category", her: "For Her", him: "For Him", couples: "For Couples", custom: "Customized", morse: "Morse Bracelets", d1: "Discover", d2: "Discover", d3: "Discover", unique: "Unique", sacred: "Sacred Messages" }
        };

        function changeLang(langCode, label, flagSrc) {
            document.getElementById('active-flag').src = flagSrc;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            const content = translations[langCode];
            document.getElementById('nav-home').innerText = content.home;
            document.getElementById('nav-consult').innerText = content.consult;
            document.getElementById('nav-shop').innerHTML = `Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i>`;
            document.getElementById('nav-bracelets').innerText = content.bracelets;
            document.getElementById('nav-digital').innerText = content.digital;
            document.getElementById('nav-about').innerText = content.about;
            document.getElementById('nav-contact').innerText = content.contact;
            document.getElementById('page-title').innerText = content.title;
            document.getElementById('cat-her').innerText = content.her;
            document.getElementById('cat-him').innerText = content.him;
            document.getElementById('cat-couples').innerText = content.couples;
            document.getElementById('cat-custom').innerText = content.custom;
            document.getElementById('cat-morse').innerText = content.morse;
            document.getElementById('span-discover-1').innerText = content.d1;
            document.getElementById('span-discover-2').innerText = content.d2;
            document.getElementById('span-discover-3').innerText = content.d3;
            document.getElementById('span-unique').innerText = content.unique;
            document.getElementById('span-sacred').innerText = content.sacred;
        }

        window.onclick = function(event) { if (!event.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); }
    </script>
</body>
</html>
