<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.08);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --dark-glow: 0 0 25px rgba(0, 0, 0, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 100%; 
            background: #000; 
            color: var(--white);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('cristale3.jpg') no-repeat center center;
            background-size: cover;
            animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            height: 80px; display: flex; justify-content: center; align-items: center;
        }

        .logo-header {
            font-family: 'Playfair Display', serif;
            text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }

        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .shop-container {
            padding: 140px 10% 120px;
            max-width: 1400px;
            margin: 0 auto;
            text-align: center;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 2.5rem);
            color: var(--gold);
            margin-bottom: 40px;
            text-shadow: var(--dark-glow);
        }

        .product-grid {
            display: grid;
            /* Am limitat lățimea maximă a coloanelor pentru ca produsele să nu fie uriașe */
            grid-template-columns: repeat(auto-fit, minmax(280px, 350px));
            gap: 30px;
            justify-content: center;
        }

        .product-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 4px;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--gold);
            background: rgba(255, 255, 255, 0.12);
        }

        .product-media {
            width: 100%; aspect-ratio: 1/1; background: rgba(0,0,0,0.3);
            margin-bottom: 15px; border: 1px solid rgba(197, 160, 89, 0.2);
            overflow: hidden;
            border-radius: 2px;
        }

        .product-media video {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 1.2s ease; /* Tranziție mai lungă și fină */
        }

        /* ZOOM SUBTIL: Modificat de la 1.1 la 1.04 pentru a nu fi deranjant */
        .product-card:hover .product-media video {
            transform: scale(1.04);
        }

        .product-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.1rem; color: var(--gold); margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .product-description {
            font-size: 0.8rem; color: #ccc; margin-bottom: 20px;
            min-height: 50px; line-height: 1.4; font-weight: 400;
        }

        .order-btn {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 10px 25px; text-transform: uppercase;
            letter-spacing: 2px; font-weight: 700; font-size: 0.7rem;
            cursor: pointer; transition: var(--transition); text-decoration: none;
        }

        .order-btn:hover { background: var(--gold); color: #000; }

        footer {
            position: relative; width: 100%; height: 80px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(15px); border-top: 1px solid var(--wine);
        }
        .social-links a { color: var(--gold); margin: 0 15px; font-size: 1.4rem; transition: var(--transition); }
        .copyright { font-size: 0.6rem; color: var(--white); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        @media (max-width: 850px) {
            header { height: 70px; }
            .sidebar { position: relative; transform: none; left: 0; flex-direction: row; flex-wrap: wrap; justify-content: center; margin-top: 80px; padding: 20px; gap: 1rem; }
            .shop-container { padding: 40px 5% 80px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    
    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <a href="products.html" class="nav-link">Shop</a>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>

    <main class="shop-container">
        <h1 class="section-title">Produse în Stoc</h1>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="product-media">
                    <video src="Rota ir pieejama.mp4" autoplay muted loop playsinline></video>
                </div>
                <h3>Prosperitate în Materie</h3>
                <p class="product-description">
                    Abundență și succes în plan material (atât pentru femei, cât și pentru bărbați). O piesă energetică creată pentru armonie și realizări.
                </p>
                <a href="contact.html" class="order-btn">Solicită Comandă</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/energetiskas_rotas" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
</body>
</html>
