<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --wine: #5e1914; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        
        /* HEADER OPTIMIZAT PENTRU TRADUCERI */
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass); min-height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; flex-wrap: wrap; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }
        .lang-selector { display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--white); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; opacity: 0.5; transition: var(--transition); cursor: pointer; }
        .lang-btn.active { opacity: 1; color: var(--gold); }

        .sidebar { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .shimmer-element, .social-links a i { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        main { flex: 1; padding: 180px 5% 100px; max-width: 1550px; margin: 0 auto; width: 100%; text-align: center; }
        .section-subtitle { color: var(--wine); letter-spacing: 10px; text-transform: uppercase; font-size: 1rem; font-weight: 700; margin-bottom: 15px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 5rem); font-style: italic; margin-bottom: 60px; line-height: 1.1; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
        .product-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid var(--glass); padding: 30px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; transition: var(--transition); }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .product-media { width: 100%; aspect-ratio: 1/1; background: rgba(0, 0, 0, 0.3); overflow: hidden; margin-bottom: 25px; border-radius: 2px; }
        .product-media video { width: 100%; height: 100%; object-fit: contain; }
        
        .product-card h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 12px; font-style: italic; }
        .product-description { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 20px; min-height: 50px; line-height: 1.5; }
        .product-price { font-family: 'Montserrat', sans-serif; color: var(--white); font-weight: 600; font-size: 1.3rem; margin-bottom: 25px; }
        .order-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.5s; text-decoration: none; }
        .order-btn:hover { background: var(--gold); color: #000; }

        footer { height: 80px; border-top: 1px solid var(--wine); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); }
        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .copyright { font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

        @media (max-width: 850px) {
            header { min-height: 70px; justify-content: center; gap: 10px; }
            .logo-header { width: 100%; text-align: center; }
            .sidebar { position: fixed; top: 110px; left: 0; transform: none; flex-direction: row; justify-content: center; padding: 15px; gap: 1rem; background: rgba(0, 0, 0, 0.85); width: 100%; border-bottom: 1px solid var(--glass); }
            main { padding-top: 240px; }
            .product-grid { gap: 30px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-selector">
            <button onclick="changeLang('ru')" class="lang-btn" id="btn-ru">RU</button>
            <button onclick="changeLang('lv')" class="lang-btn" id="btn-lv">LV</button>
            <button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
            <button onclick="changeLang('ro')" class="lang-btn active" id="btn-ro">RO</button>
        </div>
    </header>
    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <a href="products.html" class="nav-link" id="nav-shop">Shop</a>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>
    <main>
        <div class="section-subtitle" id="sub-title">O experiență hipnotică</div>
        <h1 class="section-title shimmer-element" id="main-title">The Power Shop</h1>
        <div class="product-grid" id="product-grid"></div>
    </main>
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
    <script>
        const translations = {
            ro: {
                home: "Acasă", consult: "Consultații", shop: "Shop", about: "Despre", contact: "Contact",
                sub: "O experiență hipnotică", title: "The Power Shop", order: "Vreau această energie", request: "La cerere",
                items: [
                    { n: "Prosperitate în Materie", d: "Manifestă succesul și abundența în plan real.", p: "La cerere", v: "Rota ir pieejama.mp4" },
                    { n: "Echilibru Antistres", d: "O oază de liniște purtată la încheietură.", p: "72€", v: "ANTISTRESS.mp4" },
                    { n: "Realizarea Dorințelor", d: "Malahit și Lavă pentru materializarea intențiilor.", p: "71€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Bărbatul Noii Ere", d: "Putere masculină rafinată prin cristale nobile.", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" }
                ]
            },
            ru: {
                home: "Главная", consult: "Консультации", shop: "Магазин", about: "Обо мне", contact: "Контакт",
                sub: "Гипнотический опыт", title: "The Power Shop", order: "Я хочу эту энергию", request: "По запросу",
                items: [
                    { n: "Процветание в материи", d: "Проявите успех и изобилие в реальности.", p: "По запросу", v: "Rota ir pieejama.mp4" },
                    { n: "Антистрессовый баланс", d: "Оазис спокойствия на вашем запястье.", p: "72€", v: "ANTISTRESS.mp4" },
                    { n: "Исполнение желаний", d: "Малахит и лава для материализации намерений.", p: "71€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Мужчина новой эры", d: "Мужская сила, изысканная благородными кристаллами.", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" }
                ]
            }
        };

        function changeLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            ['home','consult','shop','about','contact'].forEach(id => document.getElementById('nav-'+id).innerText = translations[lang][id]);
            document.getElementById('sub-title').innerText = translations[lang].sub;
            document.getElementById('main-title').innerText = translations[lang].title;

            document.getElementById('product-grid').innerHTML = translations[lang].items.map(i => `
                <div class="product-card">
                    <div class="product-media"><video src="${i.v}" autoplay muted loop playsinline></video></div>
                    <h3>${i.n}</h3>
                    <p class="product-description">${i.d}</p>
                    <div class="product-price">${i.p}</div>
                    <a href="contact.html" class="order-btn">${translations[lang].order}</a>
                </div>
            `).join('');
        }
        changeLang('ro');
    </script>
</body>
</html>
