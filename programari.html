<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultații | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* CSS Identic cu index.html pentru Header/Footer/Sidebar */
        :root { --gold: #c5a059; --wine: #5e1914; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; }
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass); min-height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; flex-wrap: wrap; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }
        .lang-selector { display: flex; gap: 15px; }
        .lang-btn { background: none; border: none; color: var(--white); font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; opacity: 0.5; transition: var(--transition); cursor: pointer; }
        .lang-btn.active { opacity: 1; color: var(--gold); }
        .sidebar { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .shimmer-element, .social-links a i { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        
        main { flex: 1; padding: 180px 8% 100px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid var(--glass); padding: 40px; text-align: center; }
        .service-card h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 20px; font-style: italic; }
        .book-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; font-size: 0.7rem; cursor: pointer; text-decoration: none; }

        @media (max-width: 850px) {
            header { min-height: 70px; justify-content: center; gap: 10px; }
            .sidebar { position: fixed; top: 110px; left: 0; transform: none; flex-direction: row; justify-content: center; padding: 15px; gap: 1rem; background: rgba(0, 0, 0, 0.85); width: 100%; border-bottom: 1px solid var(--glass); }
            main { padding-top: 220px; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-selector">
            <button onclick="changeLang('ru')" class="lang-btn" id="btn-ru">RU</button>
            <button onclick="changeLang('lv')" class="lang-btn" id="btn-lv">LV</button>
            <button onclick="changeLang('en')" class="lang-btn" id="btn-en">EN</button>
            <button onclick="changeLang('ro')" class="lang-btn" id="btn-ro">RO</button>
        </div>
    </header>
    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <a href="products.html" class="nav-link" id="nav-shop">Shop</a>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>
    <main>
        <h1 id="page-title" class="shimmer-element" style="text-align:center;margin-bottom:60px;font-family:'Playfair Display',serif;font-style:italic;">Consultații</h1>
        <div class="services-grid" id="services-grid"></div>
    </main>
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
        </div>
        <p class="copyright">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
    <script>
        const translations = {
            ro: { home:"Acasă", consult:"Consultații", shop:"Shop", about:"Despre", contact:"Contact", title:"Consultații & Ghidare", book:"Rezervă", services:[{t:"Life Realisation", d:"Analiza misiunii personale."}, {t:"Business", d:"Strategii energetice success."}] },
            ru: { home:"Главная", consult:"Консультации", shop:"Магазин", about:"Обо мне", contact:"Контакт", title:"Консультации", book:"Записаться", services:[{t:"Самореализация", d:"Анализ миссии."}, {t:"Бизнес", d:"Энергостратегии."}] }
        };
        function changeLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-'+lang).classList.add('active');
            ['home','consult','shop','about','contact'].forEach(id => document.getElementById('nav-'+id).innerText = translations[lang][id]);
            document.getElementById('page-title').innerText = translations[lang].title;
            document.getElementById('services-grid').innerHTML = translations[lang].services.map(s => `<div class='service-card'><h3>${s.t}</h3><p>${s.d}</p><br><a href='contact.html' class='book-btn'>${translations[lang].book}</a></div>`).join('');
        }
        changeLang('ro');
    </script>
</body>
</html>
