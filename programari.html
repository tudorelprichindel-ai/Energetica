<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultații | The Power Boutique</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">

    <style>
        /* --- MASTER GLOBAL STYLES --- */
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --hermes-terracotta: #d35400; 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        body { width: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; background: #000; display: flex; flex-direction: column; min-height: 100vh; }

        /* CURSOR MASTER - REPARAT (FĂRĂ TRANSITION PENTRU MIȘCARE INSTANT) */
        .cursor-dot { 
            width: 8px; height: 8px; background: #fff; border-radius: 50%; 
            position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; 
            transform: translate3d(-50%, -50%, 0); 
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), 0 0 30px 10px rgba(197, 160, 89, 0.5); 
            animation: slowStarPulse 6s infinite ease-in-out; 
            will-change: transform;
            transition: none !important; /* Esențial pentru a nu se mișca singur */
        }
        .cursor-dot::before, .cursor-dot::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: rayShimmer 5s infinite alternate; }
        .cursor-dot::before { width: 70px; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        .cursor-dot::after { width: 1px; height: 70px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        
        @keyframes slowStarPulse { 0%, 100% { scale: 1; opacity: 0.9; } 50% { scale: 1.2; opacity: 1; } }
        @keyframes rayShimmer { 0% { opacity: 0.6; } 100% { opacity: 1; } }

        /* BACKGROUND HYBRID (Rezolvă LCP Desktop 8.1s) */
        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            /* Gradient mai închis pentru contrast (Scor Accesibilitate 100) */
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('cristale3.jpg') no-repeat center center;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), -webkit-image-set(url('cristale3.webp') 1x, url('cristale3.jpg') 1x);
            background-size: cover; will-change: transform; animation: cinematicZoom 45s infinite alternate ease-in-out; 
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.15); } }

        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; overflow: hidden; }
        .particle { position: absolute; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); border-radius: 50%; opacity: 0.8; will-change: transform; }

        /* HEADER MASTER (CLS Fix) */
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); height: 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 5%; }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; color: var(--gold); }
        
        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; right: 0; background: #000; border: 1px solid var(--gold); display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; text-align: center; }

        .desktop-nav { display: flex; gap: 2.5rem; margin-top: 5px; }
        .nav-link, .submenu-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; transition: var(--transition); }
        .nav-item-container { position: relative; height: 100%; display: flex; align-items: center; }
        .submenu { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.95); border: 1px solid var(--gold); min-width: 220px; padding: 20px; flex-direction: column; gap: 15px; }
        .nav-item-container:hover .submenu { display: flex; }

        /* MARQUEE ORIGINAL */
        .marquee-section { width: 100%; margin-top: 80px; background: rgba(0, 0, 0, 0.4); border-bottom: 1px solid rgba(197, 160, 89, 0.2); padding: 15px 0; overflow: hidden; white-space: nowrap; position: relative; z-index: 10; }
        .marquee-content { display: inline-block; animation: marquee 40s linear infinite; }
        .marquee-item { display: inline-block; color: var(--gold); font-size: 0.7rem; letter-spacing: 6px; text-transform: uppercase; margin: 0 40px; opacity: 0.8; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .page-container { padding: 60px 5% 120px; width: 100%; max-width: 1400px; margin: 0 auto; text-align: center; }
        .booking-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; text-align: left; margin-top: 40px; }
        .service-list { display: flex; flex-direction: column; gap: 20px; }

        .service-card { position: relative; background: rgba(0,0,0,0.4); border: 1px solid rgba(197, 160, 89, 0.2); padding: 30px; transition: 0.4s; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; gap: 10px; border-radius: 4px; min-height: 180px; justify-content: center; }
        .service-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.15; z-index: 0; transition: var(--transition); }
        
        /* CARD SPECIFIC WEB FALLBACKS */
        .card-life::before { background-image: url('consultation-life.jpg'); background-image: image-set(url('consultation-life.webp') 1x, url('consultation-life.jpg') 1x); }
        .card-biz::before { background-image: url('consultation-business.jpg'); background-image: image-set(url('consultation-business.webp') 1x, url('consultation-business.jpg') 1x); }

        .service-card:hover::before, .service-card.selected::before { opacity: 0.35; transform: scale(1.05); }
        .service-card.selected { border-color: var(--gold); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .service-card > * { position: relative; z-index: 1; }
        .service-card i { font-size: 1.8rem; color: var(--gold); margin-bottom: 5px; }

        .calendar-container { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); padding: 50px; border: 1px solid var(--gold); position: sticky; top: 120px; border-radius: 4px; }
        .form-control { width: 100%; padding: 18px; background: rgba(0,0,0,0.3); border: 1px solid rgba(197,160,89,0.2); color: #fff; margin-bottom: 20px; outline: none; }
        .submit-btn { width: 100%; padding: 20px; border: 1px solid var(--gold); background: transparent; color: var(--gold); text-transform: uppercase; letter-spacing: 4px; font-weight: 700; cursor: pointer; transition: 0.4s; }
        .submit-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 30px rgba(197, 160, 89, 0.4); }

        footer { position: relative; padding: 40px 0; border-top: 1px solid var(--burgundy); background: rgba(0, 0, 0, 0.9); text-align: center; }
        .social-links { display: flex; gap: 30px; justify-content: center; margin-bottom: 15px; font-size: 1.2rem; }
        .social-links a { color: var(--gold); transition: 0.3s; }

        @media (max-width: 1024px) {
            .cursor-dot { display: none !important; }
            * { cursor: auto !important; }
            header { height: 80px; flex-direction: row; justify-content: space-between; }
            .desktop-nav { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.98); flex-direction: column; justify-content: flex-start; align-items: center; opacity: 0; visibility: hidden; transition: 0.5s ease; z-index: 2100; padding-top: 100px; }
            .desktop-nav.active { opacity: 1; visibility: visible; }
            .booking-grid { grid-template-columns: 1fr; }
            .calendar-container { position: relative; top: 0; padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div id="particles-container"></div>
    <div class="cursor-dot" id="dot"></div>
    <div class="fixed-bg" fetchpriority="high"></div>

    <header>
        <div class="header-top">
            <div class="menu-toggle" id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('active')"><i class="fas fa-bars"></i></div>
            <a href="index.html" class="logo-header">The Power Boutique</a>
            <div class="lang-dropdown">
                <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')" aria-label="Select Language">
                    <img src="https://flagcdn.com/w20/ro.png" width="20" height="13" alt="RO"> 
                    <span id="active-lang">RO</span> <i class="fas fa-chevron-down" style="font-size: 0.5rem;"></i>
                </button>
                <div class="lang-list" id="lang-list">
                    <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')">RO</button>
                    <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')">EN</button>
                </div>
            </div>
        </div>
        <nav class="desktop-nav" id="sidebar">
            <a href="index.html" class="nav-link">Acasă</a>
            <a href="programari.html" class="nav-link">Consultații</a>
            <div class="nav-item-container">
                <a href="javascript:void(0)" class="nav-link">Shop <i class="fas fa-chevron-down" style="font-size:0.5rem;"></i></a>
                <div class="submenu">
                    <a href="products.html" class="submenu-link">Brățări</a>
                    <a href="digital-shop.html" class="submenu-link">Digital</a>
                </div>
            </div>
            <a href="despre.html" class="nav-link">Despre</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
    </header>

    <div class="marquee-section">
        <div class="marquee-content">
            <span class="marquee-item">ENERGY</span>• <span class="marquee-item">LUXURY</span>• <span class="marquee-item">POWER</span>• <span class="marquee-item">BALANCE</span>• <span class="marquee-item">HARMONY</span>• <span class="marquee-item">INTENTION</span>
        </div>
    </div>

    <main class="page-container">
        <h1 class="hub-title">Servicii de Consultații</h1>
        <div class="booking-grid">
            <div class="service-list">
                <div class="service-card card-life selected" onclick="selectService(this, 'life')">
                    <i class="fas fa-gem" aria-hidden="true"></i>
                    <h3>Life Realisation</h3>
                    <p>Descoperă-ți potențialul ascuns.</p>
                    <span class="service-price">45 min • 250 RON</span>
                </div>
            </div>

            <div class="calendar-container">
                <form onsubmit="event.preventDefault(); window.open('https://wa.me/40730685087', '_blank');">
                    <input type="text" id="selected-service" class="form-control" value="Life Realisation" readonly style="color:var(--gold); font-weight:700;">
                    <input type="text" class="form-control" placeholder="Numele tău" required>
                    <input type="date" class="form-control" required>
                    <button type="submit" class="submit-btn" aria-label="Solicită Programare">Solicită Programare</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p style="font-size: 0.65rem; opacity:0.5; letter-spacing:3px;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        // CURSOR INSTANTANEU
        window.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 1024) {
                const dot = document.getElementById('dot');
                if(dot) dot.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0) translate(-50%, -50%)`;
            }
        });

        // PARTICULE CU DELAY PENTRU PERFORMANȚĂ
        const particleContainer = document.getElementById('particles-container');
        let particles = [];
        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.element = document.createElement('div');
                this.element.className = 'particle';
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                particleContainer.appendChild(this.element);
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if(this.x > window.innerWidth || this.x < 0) this.speedX *= -1;
                if(this.y > window.innerHeight || this.y < 0) this.speedY *= -1;
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }
        }

        function init() { particles = []; particleContainer.innerHTML = ''; for(let i=0; i<45; i++) particles.push(new Particle()); }
        function animate() { particles.forEach(p => p.update()); requestAnimationFrame(animate); }

        window.addEventListener('load', () => {
            // Delay de 1 secunda pentru a permite LCP si Text Rendering fara blocaje
            setTimeout(() => { init(); animate(); }, 1000);
        });
        window.onclick = (e) => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); };
    </script>
</body>
</html>
