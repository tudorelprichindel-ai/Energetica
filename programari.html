<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultații | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #c5a059;
            --wine: #5e1914;
            --white: #ffffff;
            --hermes-terracotta: #d35400;
            --glass: rgba(255, 255, 255, 0.05);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --dark-glow: 0 0 25px rgba(0, 0, 0, 0.95), 2px 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* CURSOR LOGIC */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        
        body { 
            width: 100%; background: #000; color: var(--white);
            font-family: 'Montserrat', sans-serif; overflow-x: hidden;
            line-height: 1.6; -webkit-font-smoothing: antialiased;
        }

        /* STIL CURSOR DIAMANT */
        .cursor-dot {
            width: 25px; height: 25px;
            background-image: url('diamond-graphic-clipart-design-free-png.webp');
            background-size: contain; background-repeat: no-repeat; background-position: center;
            position: fixed; pointer-events: none; z-index: 9999; 
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }
        .cursor-dot.glow { width: 38px; height: 38px; filter: brightness(1.2); }

        /* FUM SUBȚIRE ȘI FLUID */
        .cursor-trail {
            position: fixed; pointer-events: none; z-index: 9998;
            width: 15px; height: 15px; border-radius: 50%; opacity: 0;
            transform: translate(-50%, -50%); filter: blur(4px); 
            transition: opacity 1s ease-out; animation: smokeRise 4s infinite ease-out;
        }
        .trail-gold { background: var(--gold); }
        .trail-burgundy { background: var(--wine); }
        .trail-terracotta { background: var(--hermes-terracotta); }

        @keyframes smokeRise {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -120%) scale(2); opacity: 0; }
        }

        .fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; 
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), url('cristale3.jpg') no-repeat center center;
            background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out;
        }

        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* HEADER & NAVBAR Consistență Main Page */
        header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(197, 160, 89, 0.2); height: 90px;
            display: flex; justify-content: space-between; align-items: center; padding: 0 5%;
        }

        .logo-header {
            font-family: 'Playfair Display', serif; font-style: italic;
            text-decoration: none; font-size: 1.5rem; letter-spacing: 4px; font-weight: 700;
            background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shimmerEffect 5s linear infinite;
        }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        /* SELECTOR LIMBA Consistență Main Page */
        .lang-dropdown { position: relative; }
        .lang-current { 
            background: transparent; border: 1px solid var(--gold); color: var(--gold); 
            padding: 10px 18px; font-size: 0.8rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px; min-width: 110px;
            transition: var(--transition);
        }
        .lang-current:hover { background: rgba(197, 160, 89, 0.1); }
        
        .lang-list { 
            position: absolute; top: 100%; right: 0; width: 100%; background: #000; 
            border: 1px solid var(--gold); border-top: none; display: none; 
            flex-direction: column; z-index: 2100; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .lang-list.show { display: flex; }
        .lang-item { 
            background: none; border: none; color: var(--white); padding: 14px; 
            font-size: 0.75rem; display: flex; align-items: center; justify-content: center; 
            gap: 10px; transition: 0.3s;
        }
        .lang-item:hover { background: var(--gold); color: #000; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        .sidebar {
            position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 2.5rem;
        }
        .nav-link {
            text-decoration: none; color: var(--gold); font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 4px; transition: var(--transition);
            font-weight: 700; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .consultation-container {
            padding: 180px 5% 120px; max-width: 1550px; margin: 0 auto; text-align: center;
        }

        .section-subtitle {
            color: var(--wine); letter-spacing: 12px; text-transform: uppercase;
            font-size: 1.2rem; font-weight: 700; margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        .section-title {
            font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 6rem);
            font-style: italic; color: var(--gold); margin-bottom: 80px; letter-spacing: 4px; 
            font-weight: 700; line-height: 1.1; text-shadow: var(--dark-glow);
        }

        .consultation-grid {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 50px; justify-content: center;
        }

        .consultation-card {
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px); border: 1px solid var(--glass);
            padding: 60px 35px; transition: var(--transition);
            display: flex; flex-direction: column; align-items: center;
            border-radius: 4px; position: relative; overflow: hidden;
        }

        .consultation-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0.4; z-index: -1; transition: opacity 0.5s ease;
        }
        .consultation-card:nth-child(1)::before { background-image: url('consultation-life.jpg'); }
        .consultation-card:nth-child(2)::before { background-image: url('consultation-business.jpg'); }
        .consultation-card:nth-child(3)::before { background-image: url('consultation-astrology.jpg'); }
        .consultation-card:nth-child(4)::before { background-image: url('club.jpg'); }
        .consultation-card:nth-child(5)::before { background-image: url('tgame.jpg'); }

        .consultation-card:hover { transform: translateY(-10px); border-color: rgba(197, 160, 89, 0.4); background: rgba(255, 255, 255, 0.07); }
        .consultation-card:hover::before { opacity: 0.6; }

        .card-icon { font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; text-shadow: var(--dark-glow); }
        .consultation-card h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 15px; font-style: italic; text-shadow: var(--dark-glow); }
        .consultation-card p { font-size: 0.95rem; color: rgba(255,255,255,0.85); margin-bottom: 40px; font-weight: 400; text-shadow: 1px 1px 5px rgba(0,0,0,1); }

        .service-list { list-style: none; padding: 0; margin-bottom: 30px; text-align: left; width: 100%; }
        .service-list li { margin-bottom: 12px; font-weight: 300; display: flex; align-items: center; font-size: 0.85rem; color: #ccc; }
        .service-list li::before { content: "◈"; color: var(--gold); margin-right: 15px; }

        .book-btn {
            background: transparent; border: 1px solid var(--gold);
            color: var(--gold); padding: 12px 35px; text-transform: uppercase;
            letter-spacing: 4px; font-weight: 700; font-size: 0.7rem;
            cursor: pointer; transition: 0.5s ease; text-decoration: none;
            display: inline-block; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        .book-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 25px rgba(197, 160, 89, 0.4); }

        /* FOOTER Consistență Main Page */
        footer {
            position: relative; width: 100%; padding: 60px 20px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(94, 25, 20, 0.4);
        }
        .social-links { margin-bottom: 20px; }
        .social-links a { color: var(--gold); margin: 0 20px; font-size: 1.6rem; transition: var(--transition); }
        .social-links a:hover { color: var(--white); transform: scale(1.2); }
        .copyright { font-size: 0.7rem; color: var(--white); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; opacity: 0.8; }

        @media (max-width: 1100px) {
            .consultation-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 850px) {
            header { padding: 0 2%; height: 80px; }
            .sidebar { position: relative; top: 0; left: 0; transform: none; flex-direction: row; flex-wrap: wrap; justify-content: center; margin-top: 100px; padding: 20px 10px; gap: 1.5rem; }
            .consultation-container { padding: 40px 15px 100px; }
            .consultation-grid { grid-template-columns: 1fr; gap: 40px; }
        }
    </style>
</
