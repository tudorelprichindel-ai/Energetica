<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultații | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --wine: #5e1914; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        
        /* HEADER - DROPDOWN COMPACT */
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px 0 5%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; }

        .lang-dropdown { position: relative; display: flex; align-items: center; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 0; font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 -2px var(--gold), 0 8px 0 -4px var(--gold); height: 40px; width: 90px; }
        .lang-list { position: absolute; top: calc(100% + 15px); right: 0; background: rgba(0, 0, 0, 0.95); border: 1px solid var(--gold); width: 90px; display: none; flex-direction: column; z-index: 2100; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .lang-list.show { display: flex; }
        .lang-btn { background: none; border: none; color: var(--white); padding: 10px 0; font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: 0.3s; }
        .lang-btn img { width: 16px; }
        .lang-btn:hover { background: rgba(197, 160, 89, 0.2); color: var(--gold); }

        /* SIDEBAR MOBIL FIX */
        .sidebar { position: fixed; top: 50%; left: 3rem; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; }
        .nav-link:hover { transform: translateX(12px); color: var(--white); }

        .shimmer-element { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        /* SECTIUNE CONSULTATII - RESTAURARE DESIGN */
        main { flex: 1; padding: 180px 8% 100px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .page-title { font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 4rem); font-style: italic; text-align: center; margin-bottom: 60px; }

        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .service-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid var(--glass); padding: 40px; border-radius: 2px; transition: var(--transition); display: flex; flex-direction: column; height: 100%; }
        .service-card:hover { border-color: var(--gold); background: rgba(255, 255, 255, 0.08); transform: translateY(-5px); }
        .service-card h3 { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); margin-bottom: 20px; font-style: italic; }
        .service-card p { font-size: 0.95rem; color: rgba(255,255,255,0.8); margin-bottom: 30px; flex-grow: 1; line-height: 1.6; }
        .book-btn { align-self: flex-start; background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: 0.4s; text-decoration: none; }
        .book-btn:hover { background: var(--gold); color: #000; }

        /* FOOTER COMPLET RESTAURAT */
        footer { height: 100px; border-top: 1px solid var(--wine); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); }
        .social-links { display: flex; gap: 25px; margin-bottom: 10px; font-size: 1.4rem; }
        .social-links a { color: var(--gold); text-decoration: none; }

        @media (max-width: 850px) {
            header { height: 70px; padding: 0 15px 0 5%; }
            .sidebar { position: fixed; top: 70px; left: 0; transform: none; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 12px 5px; gap: 15px; background: rgba(0, 0, 0, 0.9); width: 100%; z-index: 1900; border-bottom: 1px solid var(--glass); }
            main { padding: 160px 20px 80px; }
            .service-card { padding: 30px 20px; text-align: center; }
            .book-btn { align-self: center; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" id="current-lang-btn" onclick="toggleLangList()">
                <span id="current-lang-text">RO</span>
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button onclick="selectLang('ru')" class="lang-btn"><img src="https://flagcdn.com/w20/ru.png" alt=""> RU</button>
                <button onclick="selectLang('lv')" class="lang-btn"><img src="https://flagcdn.com/w20/lv.png" alt=""> LV</button>
                <button onclick="selectLang('en')" class="lang-btn"><img src="https://flagcdn.com/w20/gb.png" alt=""> EN</button>
                <button onclick="selectLang('ro')" class="lang-btn"><img src="https://flagcdn.com/w20/ro.png" alt=""> RO</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
        <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
        <a href="products.html" class="nav-link" id="nav-shop">Shop</a>
        <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
        <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
    </nav>

    <main>
        <h1 class="page-title shimmer-element" id="page-title">Consultații & Ghidare</h1>
        <div class="services-grid" id="services-grid">
            </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="#"><i class="fab fa-tiktok shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp shimmer-element"></i></a>
        </div>
        <p style="font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const translations = {
            ro: { home: "Acasă", consult: "Consultații", shop: "Shop", about: "Despre", contact: "Contact", title: "Consultații & Ghidare", book: "Rezervă", services: [{ t: "Life Realisation", d: "Analiza misiunii personale și deblocarea potențialului tău energetic pentru a trăi în aliniere cu sinele." }, { t: "Business & Cariera", d: "Strategii energetice pentru succes profesional, managementul puterii și atragerea abundenței." }, { t: "Astrologie & Destin", d: "Descifrarea hărții natale pentru a înțelege parcursul vieții și momentele cheie de evoluție." }] },
            ru: { home: "Главная", consult: "Консультации", shop: "Магазин", about: "Обо мне", contact: "Контакт", title: "Консультации", book: "Записаться", services: [{ t: "Самореализация", d: "Анализ личной миссии и разблокировка вашего потенциала." }, { t: "Бизнес", d: "Энергетические стратегии для успеха." }, { t: "Астрология", d: "Расшифровка натальной карты." }] },
            lv: { home: "Sākums", consult: "Konsultācijas", shop: "Veikals", about: "Par mani", contact: "Kontakti", title: "Konsultācijas", book: "Pieteikties", services: [{ t: "Dzīves realizācija", d: "Personīgās misijas analīze." }, { t: "Bizness", d: "Enerģētiskās stratēģijas." }, { t: "Astroloģija", d: "Dzimšanas kartes atšifrēšana." }] },
            en: { home: "Home", consult: "Consultations", shop: "Shop", about: "About", contact: "Contact", title: "Consultations", book: "Book Now", services: [{ t: "Life Realisation", d: "Personal mission analysis." }, { t: "Business", d: "Energy strategies." }, { t: "Astrology", d: "Natal chart decoding." }] }
        };

        function toggleLangList() { document.getElementById('lang-list').classList.toggle('show'); }
        function selectLang(lang) {
            document.getElementById('current-lang-text').innerText = lang.toUpperCase();
            document.getElementById('lang-list').classList.remove('show');
            changeLang(lang);
        }
        function changeLang(lang) {
            ['home', 'consult', 'shop', 'about', 'contact'].forEach(id => document.getElementById('nav-' + id).innerText = translations[lang][id]);
            document.getElementById('page-title').innerText = translations[lang].title;
            document.getElementById('services-grid').innerHTML = translations[lang].services.map(s => `<div class="service-card"><h3>${s.t}</h3><p>${s.d}</p><a href="contact.html" class="book-btn">${translations[lang].book}</a></div>`).join('');
        }
        window.onclick = e => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); }
        window.onload = () => selectLang('ro');
    </script>
</body>
</html>
