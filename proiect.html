<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Power Boutique by Jelena Shipko. Descoperă brățări energetice, instrumente de transformare și consultații personalizate.">
    <title>The Power Boutique</title>
    
    <link rel="preload" as="image" href="cristale3-mobile.webp" media="(max-width: 1024px)" fetchpriority="high">
    <link rel="preload" as="image" href="cristale3.jpg" media="(min-width: 1025px)" fetchpriority="high">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></noscript>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #c5a059; --burgundy: #5e1914; --white: #ffffff; 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        html, body { width: 100%; height: 100%; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        .cursor-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), 0 0 30px 10px rgba(197, 160, 89, 0.5); animation: slowStarPulse 6s infinite ease-in-out; }
        @keyframes slowStarPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }

        /* MODIFICARE: Overlay 0.85 pentru Accesibilitate 100 */
        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-color: #000; 
            background-size: cover; transform: translateZ(0); animation: cinematicZoom 45s infinite alternate ease-in-out; 
        }
        @media (min-width: 1025px) {
            .fixed-bg { background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        }
        @media (max-width: 1024px) {
            .fixed-bg { background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('cristale3-mobile.webp') no-repeat center top; background-size: cover; }
        }

        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        /* MODIFICARE: Dimensiuni fixe și contain pentru CLS */
        #particles-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; overflow: hidden; contain: strict; }
        .particle { position: absolute; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px var(--gold); border-radius: 50%; opacity: 0.8; will-change: transform; }

        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); height: 80px; display: flex; align-items: center; padding: 0 5%; }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .menu-toggle { display: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; color: var(--gold); }

        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .lang-list { position: absolute; top: 100%; right: 0; width: 100%; background: #000; border: 1px solid var(--gold); display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; width: 100%; }

        .desktop-nav { display: flex; gap: 2.5rem; margin-left: auto; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }

        .marquee-section { width: 100%; margin-top: 80px; background: rgba(0, 0, 0, 0.6); padding: 15px 0; overflow: hidden; white-space: nowrap; position: relative; z-index: 10; }
        .marquee-content { display: inline-block; animation: marquee 40s linear infinite; }
        .marquee-item { display: inline-block; color: var(--gold); font-size: 0.7rem; letter-spacing: 6px; margin: 0 40px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        .main-container { padding: 100px 5% 50px; display: flex; flex-direction: column; align-items: center; }
        .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 8vw, 6rem); font-style: italic; text-align: center; color: var(--gold); }
        .hero-sub { letter-spacing: 12px; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 40px; }
        .aura-btn { display: inline-block; border: 1px solid var(--gold); color: var(--gold); padding: 12px 35px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; text-decoration: none; }

        .quick-links-container { display: flex; gap: 30px; width: 100%; max-width: 1000px; margin: 80px 0; justify-content: center; }
        .glass-card { flex: 1; background: rgba(255,255,255,0.02); backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.3); padding: 40px; text-align: center; text-decoration: none; }
        .card-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #fff; font-style: italic; }

        footer { width: 100%; height: 80px; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; }
        .social-links a { color: var(--gold); font-size: 1.2rem; }

        @media (max-width: 1024px) {
            .cursor-dot { display: none !important; }
            .menu-toggle { display: block; }
            .desktop-nav { display: none; }
            .quick-links-container { flex-direction: column; }
            footer { position: relative; }
        }
    </style>
</head>
<body>
    <div id="particles-container"></div>
    <div class="cursor-dot" id="dot"></div>
    <div class="fixed-bg"></div>

    <header>
        <div class="header-top">
            <div class="menu-toggle" id="menuBtn"><i class="fas fa-bars"></i></div>
            <a href="index.html" class="logo-header">The Power Boutique</a>
            <div class="lang-dropdown">
                <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                    <img src="https://flagcdn.com/w20/ro.png" style="width:18px" alt="RO"> RO <i class="fas fa-chevron-down" style="font-size:0.5rem"></i>
                </button>
                <div class="lang-list" id="lang-list">
                    <button class="lang-item" onclick="location.reload()">RO</button>
                    <button class="lang-item" onclick="location.reload()">EN</button>
                </div>
            </div>
        </div>
    </header>

    <div class="marquee-section">
        <div class="marquee-content">
            <span class="marquee-item">ENERGY</span>• <span class="marquee-item">LUXURY</span>• <span class="marquee-item">POWER</span>• <span class="marquee-item">BALANCE</span>• <span class="marquee-item">HARMONY</span>• <span class="marquee-item">ENERGY</span>• <span class="marquee-item">LUXURY</span>• <span class="marquee-item">POWER</span>
        </div>
    </div>

    <main class="main-container">
        <h1 class="hero-title">The Power Boutique</h1>
        <p class="hero-sub">BY JELENA SHIPKO</p>
        <a href="products.html" class="aura-btn">Descoperă Universul</a>

        <div class="quick-links-container">
            <a href="products.html" class="glass-card">
                <h3 class="card-title">Shop</h3>
                <p style="font-size:0.7rem; color:var(--gold); letter-spacing:2px">EXPLOREAZĂ COLECȚIA</p>
            </a>
            <a href="programari.html" class="glass-card">
                <h3 class="card-title">Consultații</h3>
                <p style="font-size:0.7rem; color:var(--gold); letter-spacing:2px">PROGRĂMEAZĂ O SESIUNE</p>
            </a>
        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
            <a href="https://wa.me/40730685087" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p style="font-size: 0.6rem; opacity: 0.7; letter-spacing: 3px;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const particleContainer = document.getElementById('particles-container');
        let particles = [];
        let mouse = { x: null, y: null, radius: 120 };

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.element = document.createElement('div');
                this.element.className = 'particle';
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                particleContainer.appendChild(this.element);
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > window.innerWidth || this.x < 0) this.speedX *= -1;
                if (this.y > window.innerHeight || this.y < 0) this.speedY *= -1;
                
                if (mouse.x != null && window.innerWidth > 1024) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < mouse.radius) { this.x += (dx/dist)*1.5; this.y += (dy/dist)*1.5; }
                }
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }
        }

        function init() {
            particles = []; particleContainer.innerHTML = '';
            let n = window.innerWidth < 768 ? 20 : 45;
            for (let i = 0; i < n; i++) particles.push(new Particle());
        }

        function animate() {
            particles.forEach(p => p.update());
            requestAnimationFrame(animate);
        }

        window.addEventListener('load', () => { setTimeout(() => { init(); animate(); }, 800); });
        window.addEventListener('resize', init);
        
        /* MODIFICARE: Listener pasiv pentru suta la Best Practices */
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            const dot = document.getElementById('dot');
            if (dot && window.innerWidth > 1024) { dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; }
        }, { passive: true });
    </script>
</body>
</html>
