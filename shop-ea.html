<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pentru Ea | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; 
            --burgundy: #5e1914; 
            --white: #ffffff; 
            --glass: rgba(255, 255, 255, 0.05); 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* --- SCROLLBAR AURIU --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(to bottom, transparent, var(--gold), transparent); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { 
            background: linear-gradient(to bottom, var(--gold), var(--white), var(--gold)); 
            box-shadow: 0 0 10px var(--gold); 
        }

        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        html { scroll-behavior: smooth; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }

        /* --- CURSOR MASTER (STELUȚĂ CSS - IDENTIC INDEX.HTML) --- */
        .cursor-dot { 
            width: 8px; height: 8px; background: #fff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999; 
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), 0 0 30px 10px rgba(197, 160, 89, 0.5);
            animation: slowStarPulse 6s infinite ease-in-out;
            transition: box-shadow 0.5s ease;
        }
        /* Razele steluței */
        .cursor-dot::before, .cursor-dot::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            animation: rayShimmer 5s infinite ease-in-out alternate;
        }
        .cursor-dot::before { width: 70px; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        .cursor-dot::after { width: 1px; height: 70px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.9) 50%, transparent); }
        
        /* Efect Glow la Hover */
        .cursor-dot.glow { box-shadow: 0 0 15px 4px rgba(255, 255, 255, 1), 0 0 50px 15px rgba(197, 160, 89, 0.7); }
        
        @keyframes slowStarPulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        @keyframes rayShimmer { 0% { opacity: 0.6; scale: 0.95; } 100% { opacity: 1; scale: 1.05; } }

        /* BACKGROUND */
        .fixed-bg { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; 
            background-size: cover; animation: cinematicZoom 45s infinite alternate ease-in-out; 
        }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* PARTICULE */
        #particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle { position: absolute; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px var(--gold); border-radius: 50%; opacity: 0.8; will-change: transform; }

        /* HEADER */
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .menu-toggle { display: none; color: var(--gold); font-size: 1.5rem; cursor: pointer; z-index: 2200; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid var(--gold); border-top: none; display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        /* NAV */
        .desktop-nav { display: none; } 
        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; transition: var(--transition); }
        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        @media (min-width: 1025px) { .nav-item-container:hover .submenu { display: flex; } .nav-link:hover { color: var(--white); } }
        .submenu-link { text-decoration: none; color: var(--white); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: var(--transition); }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }

        /* MARQUEE */
        .marquee-section {
            width: 100vw; margin-top: 80px; background: rgba(0, 0, 0, 0.4); 
            border-bottom: 1px solid rgba(197, 160, 89, 0.2); padding: 15px 0;
            overflow: hidden; white-space: nowrap; position: relative; z-index: 10;
            left: 50%; right: 50%; margin-left: -50vw; margin-right: -50vw;
        }
        .marquee-content { display: inline-block; animation: marquee 40s linear infinite; }
        .marquee-item { display: inline-block; color: var(--gold); font-size: 0.7rem; letter-spacing: 6px; text-transform: uppercase; margin: 0 40px; opacity: 0.8; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* MAIN CONTENT */
        main { flex: 1; padding: 100px 5% 100px; max-width: 1600px; margin: 0 auto; width: 100%; text-align: center; }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 5rem); font-style: italic; margin-bottom: 60px; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }

        /* CARDURI PRODUSE (GLASS + VIDEO AUTOPLAY) */
        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; justify-items: center; }
        
        .product-card { 
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); 
            border: 1px solid rgba(197, 160, 89, 0.1); padding: 40px; 
            display: flex; flex-direction: column; align-items: center; 
            transition: var(--transition); position: relative; width: 100%; max-width: 400px; 
        }
        .product-card:hover { transform: translateY(-15px); border-color: var(--gold); box-shadow: 0 20px 40px rgba(0,0,0,0.8); background: rgba(255, 255, 255, 0.05); }
        
        .product-media { width: 100%; aspect-ratio: 1/1; overflow: hidden; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; position: relative; }
        .product-media video { width: 100%; height: 100%; object-fit: contain; transition: transform 1s ease; }
        .product-card:hover .product-media video { transform: scale(1.1); }
        
        /* Play Icon Overlay */
        .product-media::after {
            content: '\f04b'; font-family: 'Font Awesome 5 Free'; font-weight: 900;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: rgba(255,255,255,0.7); opacity: 0; transition: 0.3s;
        }
        .product-card:hover .product-media::after { opacity: 1; }

        .product-card h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 15px; font-style: italic; }
        .shimmer-element { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }

        .product-price { font-weight: 600; font-size: 1.4rem; color: var(--white); margin-bottom: 25px; }
        
        .order-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 15px 35px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; font-size: 0.7rem; text-decoration: none; transition: 0.4s; }
        .order-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        /* LIGHTBOX */
        .lux-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 5000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; }
        .lux-modal.show { display: flex; opacity: 1; }
        .modal-content { position: relative; width: 90%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; }
        .modal-content video { width: 100%; height: auto; max-height: 80vh; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .modal-title { margin-top: 25px; font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); font-style: italic; letter-spacing: 3px; }
        .close-lux { position: absolute; top: -60px; right: 0; color: var(--gold); font-size: 2.5rem; transition: 0.3s; z-index: 5100; cursor: pointer; }

        /* FOOTER */
        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 2000; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; font-size: 1.2rem; }
        .social-links a { color: var(--gold); transition: 0.3s; }
        .social-links a:hover { transform: scale(1.1); text-shadow: 0 0 10px var(--gold); }
        .footer-copy { font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7; }

        /* MOBILE STYLES */
        @media (max-width: 1024px) {
            .cursor-dot { display: none !important; }
            * { cursor: auto !important; }
            header { height: 80px; flex-direction: row; justify-content: space-between; }
            .menu-toggle { display: block; }
            
            .desktop-nav { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.95); flex-direction: column; opacity: 0; visibility: hidden; transition: 0.5s ease; z-index: 2100; padding-top: 100px; overflow-y: auto; }
            .desktop-nav.active { opacity: 1; visibility: visible; }
            
            .nav-link { width: 100%; text-align: center; padding: 25px 0; font-size: 1.1rem; }
            .nav-item-container { width: 100%; flex-direction: column; height: auto; display: block; }
            .submenu { position: static; transform: none; background: rgba(197,160,89,0.05); border: none; width: 100%; display: none; padding: 0; }
            .nav-item-container.active-mobile .submenu { display: flex; }
            .submenu-link { width: 100%; text-align: center; padding: 20px 0; font-size: 1rem; border-top: 1px solid rgba(197,160,89,0.1); }
            
            .sidebar { display: none; }
            
            main { padding-top: 120px; padding-bottom: 120px; }
            footer { position: relative; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        // --- PARTICLES: ATRACTIE CATRE MOUSE (LOGICA PASTRATA) ---
        const particleContainer = document.getElementById('particles-container');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 3 + 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.element = document.createElement('div');
                this.element.className = 'particle';
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                particleContainer.appendChild(this.element);
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > window.innerWidth || this.x < 0) this.speedX *= -1;
                if (this.y > window.innerHeight || this.y < 0) this.speedY *= -1;
                
                if(mouse.x != null) {
                    let dx = mouse.x - this.x; let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < mouse.radius) {
                        this.x += (dx/dist)*3; 
                        this.y += (dy/dist)*3;
                    }
                }
                this.element.style.transform = `translate(${this.x}px, ${this.y}px)`;
            }
        }
        function initParticles() { particles = []; particleContainer.innerHTML = ''; let n = window.innerWidth < 768 ? 35 : 50; for(let i=0; i<n; i++) particles.push(new Particle()); }
        function animateParticles() { particles.forEach(p => p.update()); requestAnimationFrame(animateParticles); }
        initParticles(); animateParticles(); window.addEventListener('resize', initParticles);

        // --- NAVIGATION & INTERACTION ---
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const dot = document.getElementById('dot');

        menuBtn.onclick = () => { 
            mobileMenu.classList.toggle('active'); 
            menuBtn.innerHTML = mobileMenu.classList.contains('active') ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>'; 
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX; mouse.y = e.clientY;
            if (window.innerWidth > 1024 && dot) { 
                dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; 
            }
        });

        // --- PRODUCTS DATA (PENTRU EA) ---
        const translations = {
            'ro': { 
                title: "Brățări Pentru Ea", order: "Solicită Energia", 
                items: [
                    { n: "Echilibru Antistres", p: "90€", v: "ANTISTRESS.mp4" },
                    { n: "Realizarea Dorințelor", p: "113€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Prosperitate în Materie", p: "La cerere", v: "Rota ir pieejama.mp4" }
                ]
            },
            'en': { 
                title: "Bracelets For Her", order: "Request Energy", 
                items: [
                    { n: "Antistress Balance", p: "90€", v: "ANTISTRESS.mp4" },
                    { n: "Wish Realization", p: "113€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Prosperity in Matter", p: "On request", v: "Rota ir pieejama.mp4" }
                ]
            },
            'ru': {
                title: "Браслеты для неё", order: "Запросить энергию",
                items: [
                    { n: "Антистрессовый баланс", p: "90€", v: "ANTISTRESS.mp4" },
                    { n: "Исполнение желаний", p: "113€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Процветание в материи", p: "По запросу", v: "Rota ir pieejama.mp4" }
                ]
            },
            'lv': {
                title: "Aproces Viņai", order: "Pieprasīt Enerģiju",
                items: [
                    { n: "Antistresa līdzsvars", p: "90€", v: "ANTISTRESS.mp4" },
                    { n: "Vēlmju realizācija", p: "113€", v: "VĒLMJU REALIZĒŠANAS ROTA.mp4" },
                    { n: "Materiālā labklājība", p: "Pēc pieprasījuma", v: "Rota ir pieejama.mp4" }
                ]
            }
        };

        function renderProducts(langData) {
            const grid = document.getElementById('p-grid');
            grid.innerHTML = langData.items.map(i => `
                <div class="product-card">
                    <div class="product-media" onclick="openLux('${i.v}', '${i.n}')">
                        <video src="${i.v}" autoplay muted loop playsinline></video>
                    </div>
                    <h3 class="shimmer-element">${i.n}</h3>
                    <div class="product-price">${i.p}</div>
                    <a href="contact.html" class="order-btn">${langData.order}</a>
                </div>
            `).join('');
        }

        function changeLang(code, label, flag) {
            document.getElementById('active-flag').src = flag;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            const t = translations[code];
            if(!t) return;
            document.getElementById('nav-home').innerText = code === 'en' ? 'Home' : (code === 'ru' ? 'Главная' : (code === 'lv' ? 'Sākums' : 'Acasă')); 
            document.getElementById('page-title').innerText = t.title;
            renderProducts(t);
        }

        function openLux(src, title) {
            const modal = document.getElementById('luxModal');
            const video = document.getElementById('luxVideo');
            document.getElementById('luxTitle').innerText = title;
            video.src = src; modal.classList.add('show'); video.play();
        }

        function closeLux() {
            const modal = document.getElementById('luxModal');
            document.getElementById('luxVideo').pause();
            modal.classList.remove('show');
        }

        window.onclick = (e) => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); };
        
        changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png');

        document.querySelectorAll('a, button, .product-media').forEach(el => {
            el.addEventListener('mouseenter', () => dot.classList.add('glow'));
            el.addEventListener('mouseleave', () => dot.classList.remove('glow'));
        });
