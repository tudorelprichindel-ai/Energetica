        // --- MASTER ENGINE: PARTICLES & PHYSICS ---
        const particleContainer = document.getElementById('particles-container');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 };

        class Particle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 3 + 2;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.element = document.createElement('div');
                this.element.classList.add('particle');
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                particleContainer.appendChild(this.element);
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > window.innerWidth || this.x < 0) this.speedX *= -1;
                if (this.y > window.innerHeight || this.y < 0) this.speedY *= -1;
                
                if (mouse.x != null && window.innerWidth > 1024) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < mouse.radius) {
                        this.x += (dx / distance) * 2;
                        this.y += (dy / distance) * 2;
                    }
                }
                this.element.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;
            }
        }

        function initParticles() {
            particles = [];
            particleContainer.innerHTML = '';
            let n = window.innerWidth < 768 ? 20 : 50; 
            for (let i = 0; i < n; i++) particles.push(new Particle());
        }

        function animateParticles() {
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            requestAnimationFrame(animateParticles);
        }

        function updatePos(e) {
            let cx = e.type.includes('touch') ? (e.touches.length > 0 ? e.touches[0].clientX : null) : e.clientX;
            let cy = e.type.includes('touch') ? (e.touches.length > 0 ? e.touches[0].clientY : null) : e.clientY;
            
            if (cx !== null && cy !== null) {
                mouse.x = cx;
                mouse.y = cy;
                if (window.innerWidth > 1024 && dot) { 
                    dot.style.left = cx + 'px'; 
                    dot.style.top = cy + 'px'; 
                }
            }
        }

        window.addEventListener('mousemove', updatePos);
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchstart', updatePos, { passive: true });
        window.addEventListener('touchmove', updatePos, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
