<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pentru El | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --gold: #c5a059; --burgundy: #5e1914; --white: #ffffff; 
            --hermes-terracotta: #d35400; --glass: rgba(255, 255, 255, 0.05); 
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        
        .cursor-dot { width: 25px; height: 25px; background-image: url('diamond-graphic-clipart-design-free-png.webp'); background-size: contain; background-repeat: no-repeat; background-position: center; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
        .cursor-dot.glow { width: 38px; height: 38px; filter: brightness(1.2); }

        .cursor-trail { position: fixed; pointer-events: none; z-index: 9998; width: 15px; height: 15px; border-radius: 50%; opacity: 0; transform: translate(-50%, -50%); filter: blur(4px); transition: opacity 1s ease-out; animation: smokeRise 4s infinite ease-out; }
        .trail-gold { background: var(--gold); }
        .trail-burgundy { background: var(--burgundy); }
        .trail-terracotta { background: var(--hermes-terracotta); }
        @keyframes smokeRise { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 100% { transform: translate(-50%, -120%) scale(2); opacity: 0; } }

        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('cristale3.jpg') no-repeat center center; background-size: cover; animation: cinematicZoom 25s infinite alternate ease-in-out; }
        @keyframes cinematicZoom { from { transform: scale(1); } to { transform: scale(1.1); } }

        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }

        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid var(--gold); border-top: none; display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; display: flex; align-items: center; gap: 8px; }
        .flag-img { width: 18px; height: 12px; object-fit: cover; }

        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; transition: var(--transition); }
        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        @media (min-width: 1025px) { .nav-item-container:hover .submenu { display: flex; } }
        .submenu-link { text-decoration: none; color: var(--white); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: var(--transition); }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }

        main { flex: 1; padding: 160px 5% 100px; max-width: 1600px; margin: 0 auto; width: 100%; text-align: center; }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 5rem); font-style: italic; margin-bottom: 60px; background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }

        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 50px; justify-items: center; }
        .product-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(197, 160, 89, 0.1); padding: 40px; display: flex; flex-direction: column; align-items: center; transition: var(--transition); position: relative; width: 100%; max-width: 400px; }
        .product-card:hover { transform: translateY(-15px); border-color: var(--gold); box-shadow: 0 20px 40px rgba(0,0,0,0.8); background: rgba(255, 255, 255, 0.05); }
        .product-media { width: 100%; aspect-ratio: 1/1; overflow: hidden; margin-bottom: 30px; border: 1px solid rgba(255,255,255,0.05); }
        .product-media video { width: 100%; height: 100%; object-fit: contain; transition: transform 1s ease; }
        .product-card:hover .product-media video { transform: scale(1.1); }
        .product-card h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 15px; font-style: italic; }
        .product-price { font-weight: 600; font-size: 1.4rem; color: var(--white); margin-bottom: 25px; }
        .order-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 15px 35px; text-transform: uppercase; letter-spacing: 4px; font-weight: 700; font-size: 0.7rem; text-decoration: none; transition: 0.4s; }
        .order-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 15px var(--gold); }

        .lux-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 5000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.5s ease; }
        .lux-modal.show { display: flex; opacity: 1; }
        .modal-content { position: relative; width: 90%; max-width: 1100px; display: flex; flex-direction: column; align-items: center; }
        .modal-content video { width: 100%; height: auto; max-height: 80vh; border: 1px solid var(--gold); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .modal-title { margin-top: 25px; font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); font-style: italic; letter-spacing: 3px; }
        .close-lux { position: absolute; top: -60px; right: 0; color: var(--gold); font-size: 2.5rem; transition: 0.3s; z-index: 5100; }

        footer { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; z-index: 2000; border-top: 1px solid var(--burgundy); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); }
        .social-links { display: flex; gap: 30px; margin-bottom: 5px; font-size: 1.2rem; }
        .social-links a { color: var(--gold); }
        .footer-copy { font-size: 0.65rem; letter-spacing: 4px; text-transform: uppercase; opacity: 0.7; }

        @media (max-width: 1024px) {
            .sidebar { position: fixed; top: 80px; left: 0; transform: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; gap: 20px; background: rgba(0,0,0,0.95); z-index: 1999; height: auto; }
            .nav-item-container.active .submenu { display: flex; width: 100%; align-items: center; padding-left: 0; }
            main { padding-top: 200px; padding-bottom: 120px; }
            footer { position: relative; }
            .product-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="cursor-trail trail-gold" id="trail1"></div>
    <div class="cursor-trail trail-burgundy" id="trail2"></div>
    <div class="cursor-trail trail-terracotta" id="trail3"></div>

    <div class="fixed-bg"></div>

    <div class="lux-modal" id="luxModal" onclick="closeLux()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-lux" onclick="closeLux()"><i class="fas fa-times"></i></span>
            <video id="luxVideo" loop playsinline></video>
            <div class="modal-title" id="luxTitle"></div>
        </div>
    </div>

    <header>
        <a href="index.html" class="logo-header">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" class="flag-img" id="active-flag"> <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')"><img src="https://flagcdn.com/w20/ro.png" class="flag-img"> RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')"><img src="https://flagcdn.com/w20/ru.png" class="flag-img"> RU</button>
                <button class="lang-item" onclick="changeLang('lv', 'LV', 'https://flagcdn.com/w20/lv.png')"><img src="https://flagcdn.com/w20/lv.png" class="flag-img"> LV</button>
                <button class="lang-item" onclick="changeLang('en', 'EN', 'https://flagcdn.com/w20/gb.png')"><img src="https://flagcdn.com/w20/gb.png" class="flag-img"> EN</button>
            </div>
        </div>
    </header>

    <main>
        <nav class="sidebar">
            <a href="index.html" class="nav-link" id="nav-home">Acasă</a>
            <a href="programari.html" class="nav-link" id="nav-consult">Consultații</a>
            <div class="nav-item-container" onclick="if(window.innerWidth <= 1024) this.classList.toggle('active')">
                <a href="javascript:void(0)" class="nav-link" id="nav-shop">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
                <div class="submenu">
                    <a href="products.html" class="submenu-link" id="nav-bracelets">Brățări Energetice</a>
                    <a href="digital-shop.html" class="submenu-link" id="nav-digital">Digital Shop</a>
                </div>
            </div>
            <a href="despre.html" class="nav-link" id="nav-about">Despre</a>
            <a href="contact.html" class="nav-link" id="nav-contact">Contact</a>
        </nav>

        <h1 class="section-title" id="page-title">Brățări Pentru El</h1>
        <div class="product-grid" id="p-grid"></div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-tiktok"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <a href="https://wa.me/407XXXXXXXX" target="_blank"><i class="fab fa-whatsapp"></i></a>
        </div>
        <p class="footer-copy">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>

    <script>
        const dot = document.getElementById('dot');
        const trails = [
            { el: document.getElementById('trail1'), x: 0, y: 0, lag: 0.05 },
            { el: document.getElementById('trail2'), x: 0, y: 0, lag: 0.15 },
            { el: document.getElementById('trail3'), x: 0, y: 0, lag: 0.25 }
        ];

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX; mouseY = e.clientY;
            dot.style.left = mouseX + 'px'; dot.style.top = mouseY + 'px';
            trails.forEach(t => t.el.style.opacity = "1");
        });

        function animateTrails() {
            trails.forEach(t => {
                t.x += (mouseX - t.x) * t.lag; t.y += (mouseY - t.y) * t.lag;
                t.el.style.left = t.x + 'px'; t.el.style.top = t.y + 'px';
            });
            requestAnimationFrame(animateTrails);
        }
        animateTrails();

        const translations = {
            'ro': { home: "Acasă", consult: "Consultații", bracelets: "Brățări Energetice", digital: "Digital Shop", about: "Despre", contact: "Contact", title: "Brățări Pentru El", order: "Solicită Energia", items: [
                { n: "Bărbatul Noii Ere", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" },
                { n: "Prosperitate în Materie", p: "La cerere", v: "Rota ir pieejama.mp4" }
            ]},
            'ru': { home: "Главная", consult: "Консультации", bracelets: "Браслеты", digital: "Цифровой магазин", about: "О нас", contact: "Контакт", title: "Браслеты для него", order: "Запросить энергию", items: [
                { n: "Мужчина новой эры", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" },
                { n: "Процветание в материи", p: "По запросу", v: "Rota ir pieejama.mp4" }
            ]},
            'lv': { home: "Sākums", consult: "Konsultācijas", bracelets: "Aproces", digital: "Digitālais veikals", about: "Par mums", contact: "Kontakti", title: "Aproces Viņam", order: "Pieprasīt Enerģiju", items: [
                { n: "Jaunā laikmeta vīrietis", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" },
                { n: "Materiālā labklājība", p: "Pēc pieprasījuma", v: "Rota ir pieejama.mp4" }
            ]},
            'en': { home: "Home", consult: "Consultations", bracelets: "Bracelets", digital: "Digital Shop", about: "About", contact: "Contact", title: "Bracelets For Him", order: "Request Energy", items: [
                { n: "Man of the New Era", p: "188€", v: "JAUNĀ LAIKMETA VĪRIETIS.mp4" },
                { n: "Prosperity in Matter", p: "On request", v: "Rota ir pieejama.mp4" }
            ]}
        };

        function renderProducts(langData) {
            const grid = document.getElementById('p-grid');
            grid.innerHTML = langData.items.map(i => `
                <div class="product-card">
                    <div class="product-media" onclick="openLux('${i.v}', '${i.n}')">
                        <video src="${i.v}" autoplay muted loop playsinline></video>
                    </div>
                    <h3>${i.n}</h3>
                    <div class="product-price">${i.p}</div>
                    <a href="contact.html" class="order-btn">${langData.order}</a>
                </div>
            `).join('');
        }

        function changeLang(code, label, flag) {
            document.getElementById('active-flag').src = flag;
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
            const data = translations[code];
            ['home','consult','bracelets','digital','about','contact'].forEach(id => document.getElementById('nav-'+id).innerText = data[id]);
            document.getElementById('page-title').innerText = data.title;
            renderProducts(data);
        }

        function openLux(src, title) {
            const modal = document.getElementById('luxModal');
            const video = document.getElementById('luxVideo');
            document.getElementById('luxTitle').innerText = title;
            video.src = src; modal.classList.add('show'); video.play();
        }

        function closeLux() {
            const modal = document.getElementById('luxModal');
            const video = document.getElementById('luxVideo');
            video.pause(); modal.classList.remove('show');
        }

        window.onclick = e => { if (!e.target.closest('.lang-dropdown')) document.getElementById('lang-list').classList.remove('show'); }
        changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png');
        
        document.querySelectorAll('a, button, .product-media').forEach(el => {
            el.addEventListener('mouseenter', () => dot.classList.add('glow'));
            el.addEventListener('mouseleave', () => dot.classList.remove('glow'));
        });
    </script>
</body>
</html>
