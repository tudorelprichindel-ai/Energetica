<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personalizate | The Power Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #c5a059; --wine: #5e1914; --white: #ffffff; --glass: rgba(255, 255, 255, 0.05); --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; cursor: none !important; }
        body { display: flex; flex-direction: column; min-height: 100vh; background: #000; color: var(--white); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        .cursor-dot { width: 25px; height: 25px; background-image: url('diamond-graphic-clipart-design-free-png.webp'); background-size: contain; background-repeat: no-repeat; background-position: center; position: fixed; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s; }
        .fixed-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('cristale3.jpg') no-repeat center center; background-size: cover; }
        header { position: fixed; top: 0; width: 100%; z-index: 2000; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass); height: 80px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .logo-header { font-family: 'Playfair Display', serif; font-style: italic; text-decoration: none; font-size: 1.3rem; letter-spacing: 3px; font-weight: 700; color: var(--gold); }
        .lang-dropdown { position: relative; }
        .lang-current { background: rgba(255,255,255,0.03); border: 1px solid var(--gold); color: var(--gold); padding: 8px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 100px; }
        .lang-list { position: absolute; top: 100%; left: 0; width: 100%; background: #000; border: 1px solid var(--gold); border-top: none; display: none; flex-direction: column; z-index: 2100; }
        .lang-list.show { display: flex; }
        .lang-item { background: none; border: none; color: var(--white); padding: 12px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sidebar { position: fixed; top: 50%; left: 3%; transform: translateY(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 2.5rem; }
        .nav-link { text-decoration: none; color: var(--gold); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 4px; transition: var(--transition); font-weight: 700; display: flex; align-items: center; }
        .nav-item-container { position: relative; }
        .submenu { display: none; flex-direction: column; gap: 1.2rem; padding: 1rem 0 0 1.5rem; }
        @media (min-width: 1025px) { .nav-item-container:hover .submenu { display: flex; } .nav-link:hover { color: var(--white); } }
        .submenu-link { text-decoration: none; color: var(--white); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; opacity: 0.7; transition: var(--transition); }
        .submenu-link:hover { opacity: 1; color: var(--gold); transform: translateX(8px); }
        .shimmer-element { background: linear-gradient(to right, var(--gold) 20%, #fff 40%, #fff 60%, var(--gold) 80%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmerEffect 5s linear infinite; }
        @keyframes shimmerEffect { to { background-position: 200% center; } }
        main { flex: 1; padding: 180px 5% 100px; max-width: 1550px; margin: 0 auto; width: 100%; text-align: center; }
        .section-subtitle { color: var(--wine); letter-spacing: 10px; text-transform: uppercase; font-size: 1rem; font-weight: 700; margin-bottom: 15px; }
        .section-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 5rem); font-style: italic; margin-bottom: 60px; line-height: 1.1; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; }
        .product-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid var(--glass); padding: 30px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; transition: var(--transition); }
        .product-card:hover { border-color: var(--gold); transform: translateY(-5px); }
        .product-media { width: 100%; aspect-ratio: 1/1; background: rgba(0, 0, 0, 0.3); overflow: hidden; margin-bottom: 25px; border-radius: 2px; }
        .product-media video { width: 100%; height: 100%; object-fit: contain; }
        .product-card h3 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 12px; font-style: italic; }
        .product-description { font-size: 0.85rem; color: rgba(255,255,255,0.7); margin-bottom: 20px; min-height: 50px; line-height: 1.5; }
        .product-price { font-family: 'Montserrat', sans-serif; color: var(--white); font-weight: 600; font-size: 1.3rem; margin-bottom: 25px; }
        .order-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 30px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; font-size: 0.7rem; cursor: pointer; transition: 0.5s; text-decoration: none; }
        .order-btn:hover { background: var(--gold); color: #000; }
        footer { height: 80px; border-top: 1px solid var(--wine); display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); }
        .social-links { display: flex; gap: 20px; margin-bottom: 5px; }
        .social-links a { color: var(--gold); font-size: 1.2rem; }
        @media (max-width: 1024px) {
            .sidebar { position: fixed; top: 80px; left: 0; transform: none; flex-direction: column; align-items: center; width: 100%; padding: 20px; gap: 20px; background: rgba(0,0,0,0.95); z-index: 1999; height: auto; }
            .nav-item-container.active .submenu { display: flex; width: 100%; align-items: center; padding-left: 0; }
            main { padding-top: 240px; }
        }
    </style>
</head>
<body>
    <div class="cursor-dot" id="dot"></div>
    <div class="fixed-bg"></div>
    <header>
        <a href="index.html" class="logo-header shimmer-element">The Power Boutique</a>
        <div class="lang-dropdown">
            <button class="lang-current" onclick="document.getElementById('lang-list').classList.toggle('show')">
                <img src="https://flagcdn.com/w20/ro.png" style="width:18px;"> <span id="active-lang">RO</span> 
                <i class="fas fa-chevron-down" style="font-size: 0.5rem; opacity: 0.6; margin-left: 5px;"></i>
            </button>
            <div class="lang-list" id="lang-list">
                <button class="lang-item" onclick="changeLang('ro', 'RO', 'https://flagcdn.com/w20/ro.png')">RO</button>
                <button class="lang-item" onclick="changeLang('ru', 'RU', 'https://flagcdn.com/w20/ru.png')">RU</button>
            </div>
        </div>
    </header>
    <nav class="sidebar">
        <a href="index.html" class="nav-link">Acasă</a>
        <a href="programari.html" class="nav-link">Consultații</a>
        <div class="nav-item-container">
            <a href="javascript:void(0)" class="nav-link">Shop <i class="fas fa-chevron-down" style="font-size: 0.5rem; margin-left: 8px;"></i></a>
            <div class="submenu">
                <a href="products.html" class="submenu-link">Brățări Energetice</a>
                <a href="digital-shop.html" class="submenu-link">Digital Shop</a>
            </div>
        </div>
        <a href="despre.html" class="nav-link">Despre</a>
        <a href="contact.html" class="nav-link">Contact</a>
    </nav>
    <main>
        <div class="section-subtitle">Unicat & Sacru</div>
        <h1 class="section-title shimmer-element">Personalizate</h1>
        <div class="product-grid" id="product-grid"></div>
    </main>
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-instagram shimmer-element"></i></a>
            <a href="https://t.me/elena_shipko" target="_blank"><i class="fab fa-telegram-plane shimmer-element"></i></a>
        </div>
        <p style="font-size: 0.6rem; letter-spacing: 2px;">© 2026 ENERGETICA • JELENA SHIPKO</p>
    </footer>
    <script>
        const dot = document.getElementById('dot');
        window.addEventListener('mousemove', (e) => { dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px'; });
        const items = [
            { n: "Angel Frequency", d: "Ghidare spirituală prin cristale alese pe frecvența ta.", p: "350€", v: "Rota ir pieejama.mp4" }
        ];
        document.getElementById('product-grid').innerHTML = items.map(i => `
            <div class="product-card">
                <div class="product-media"><video src="${i.v}" autoplay muted loop playsinline></video></div>
                <h3>${i.n}</h3>
                <p class="product-description">${i.d}</p>
                <div class="product-price">${i.p}</div>
                <a href="contact.html" class="order-btn">Vreau această energie</a>
            </div>
        `).join('');
        function changeLang(code, label, flag) {
            document.getElementById('active-lang').innerText = label;
            document.getElementById('lang-list').classList.remove('show');
        }
    </script>
</body>
</html>
