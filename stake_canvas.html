<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stake Web SDK - Canvas Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap');
        body { 
            background: #0f1923; /* Culoare specifică arhitecturii dark mode comerciale */
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .cyber-font { font-family: 'Orbitron', sans-serif; }
        
        /* Containerul central care separă UI-ul de Game Canvas */
        #game-wrapper {
            display: flex;
            gap: 20px;
            background: #1a242d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #ui-panel { width: 250px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Aici motorul PixiJS va injecta elementul <canvas> */
        #canvas-container {
            width: 500px;
            height: 500px;
            background: #0b1118;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #2a3441;
        }

        input, button { all: unset; box-sizing: border-box; }
        .stake-input { background: #0f1923; padding: 12px; border-radius: 6px; border: 1px solid #2a3441; width: 100%; font-weight: bold; }
        .stake-btn { background: #00e701; color: #000; font-weight: 900; text-align: center; padding: 15px; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .stake-btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- Panoul de Control (HTML Clasic) -->
        <div id="ui-panel">
            <h1 class="text-2xl font-black cyber-font mb-4 text-white">WHACK-A-CAT</h1>
            <div>
                <label class="block text-xs font-bold text-gray-400 mb-2">Suma Pariată</label>
                <input type="number" class="stake-input text-white" value="10.00">
            </div>
            <button class="stake-btn cyber-font mt-auto" id="btn-bet">PARIAZĂ</button>
        </div>

        <!-- Fereastra de Randare Hardware (Canvas GPU) -->
        <div id="canvas-container"></div>
    </div>

    <script>
        // 1. Inițializarea Motorului PixiJS (Hardware Accelerated WebGL)
        const app = new PIXI.Application({
            width: 500,
            height: 500,
            backgroundColor: 0x0b1118,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true,
            antialias: true
        });

        document.getElementById('canvas-container').appendChild(app.view);

        // 2. Construirea Structurii de Bază (Grid 5x5 desenat pe GPU)
        const CELL_SIZE = 80;
        const PADDING = 15;
        const OFFSET_X = 25;
        const OFFSET_Y = 25;

        const gridContainer = new PIXI.Container();
        app.stage.addChild(gridContainer);

        const cells = [];

        for (let row = 0; row < 5; row++) {
            for (let col = 0; col < 5; col++) {
                // Desenăm formele primitive folosind placa video
                const cell = new PIXI.Graphics();
                cell.beginFill(0x1e293b); // Culoare crater
                cell.lineStyle(2, 0x334155);
                cell.drawCircle(CELL_SIZE / 2, CELL_SIZE / 2, CELL_SIZE / 2);
                cell.endFill();

                cell.x = OFFSET_X + col * (CELL_SIZE + PADDING);
                cell.y = OFFSET_Y + row * (CELL_SIZE + PADDING);
                
                // Setăm interactivitatea la nivel de Canvas
                cell.eventMode = 'static';
                cell.cursor = 'pointer';

                cell.on('pointerdown', () => {
                    console.log(`Ai lovit craterul [${row}, ${col}] pe GPU!`);
                    // Aici va veni logica de cerere a rezultatului din fișierul JSONL
                    cell.tint = 0x3b82f6; // Feedback vizual instant
                });

                gridContainer.addChild(cell);
                cells.push(cell);
            }
        }

        console.log("Motorul Canvas a fost inițializat la 60 FPS.");
    </script>
</body>
</html>
